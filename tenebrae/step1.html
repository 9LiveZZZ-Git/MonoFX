<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenebrae">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171614">
<title>Tenebrae Writer</title>
<style>
/* ============================================================
   TENEBRAE WRITER — step 2
   Manuscript editor · Book → Chapter → Scene · offline-first
   Type: New York (ui-serif) carries the words, SF whispers the chrome.
   Mark: ⁂ the asterism — scene break, focus exit, empty state.
   ============================================================ */
:root{
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --paper:#F7F5F1;
  --surface:#FFFFFF;
  --ink:#211E1C;
  --ink2:#6F6A62;
  --ink3:#A39C91;
  --hair:rgba(63,54,42,.16);
  --hair2:rgba(63,54,42,.08);
  --gild:#8A6B21;
  --gild-soft:rgba(138,107,33,.13);
  --green:#3F6B4F;
  --red:#B23A2E;
  --bar:rgba(247,245,241,.82);
  --sheet:#FCFBF9;
  --press:rgba(63,54,42,.07);
  --shadow:0 -8px 32px rgba(30,24,16,.14);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#171614;
    --surface:#201E1B;
    --ink:#EAE5DC;
    --ink2:#9B948A;
    --ink3:#6C665D;
    --hair:rgba(255,244,228,.14);
    --hair2:rgba(255,244,228,.07);
    --gild:#D9B45B;
    --gild-soft:rgba(217,180,91,.14);
    --green:#7FA98B;
    --red:#E06A55;
    --bar:rgba(23,22,20,.82);
    --sheet:#232120;
    --press:rgba(255,244,228,.08);
    --shadow:0 -8px 32px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  position:fixed;inset:0;
  overscroll-behavior:none;
  font-size:16px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[contenteditable]:focus-visible,input:focus-visible{outline:2px solid var(--gild);outline-offset:2px;border-radius:4px}
[contenteditable]:focus,input:focus{outline:none}
input{font:inherit;color:inherit;background:none;border:0}

/* ---------- screens & navigation ---------- */
#app{position:absolute;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--paper);
  transform:translateX(100%);
  transition:transform .34s cubic-bezier(.32,.72,.32,1);
  visibility:hidden;
}
.screen.on{transform:translateX(0);visibility:visible}
.screen.under{transform:translateX(-26%);visibility:visible}
#scr-library{z-index:1}
#scr-book{z-index:2}
#scr-cards{z-index:3}
#scr-card{z-index:4}
#scr-editor{z-index:5}

/* ---------- bars ---------- */
.bar{
  flex:none;
  display:flex;align-items:center;gap:4px;
  padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;
  min-height:calc(env(safe-area-inset-top) + 50px);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);
  backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:.5px solid transparent;
  position:relative;z-index:10;
  transition:border-color .2s;
}
.bar.scrolled{border-bottom-color:var(--hair)}
.bar-title{
  position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 6px);
  transform:translateX(-50%);
  height:44px;display:flex;align-items:center;
  font-family:var(--serif);font-weight:600;font-size:17px;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.bar.scrolled .bar-title{opacity:1}
.bbtn{
  display:flex;align-items:center;justify-content:center;
  min-width:44px;height:44px;border-radius:12px;
  color:var(--gild);
}
.bbtn:active{background:var(--press)}
.bbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bbtn.back{min-width:0;padding:0 10px 0 4px;gap:2px;font-size:16px;font-weight:500;max-width:45%}
.bbtn.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .spacer{flex:1}
.bbtn.txt{font-size:16px;font-weight:500;padding:0 12px;min-width:0}

/* ---------- scroll areas ---------- */
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 0 calc(env(safe-area-inset-bottom) + 96px);
}
.pagehead{padding:14px 20px 6px}
.pagehead h1{
  font-family:var(--serif);font-weight:700;font-size:32px;letter-spacing:-.01em;
  overflow-wrap:break-word;
}
.pagehead .sub{
  margin-top:4px;color:var(--ink2);font-size:14px;
  font-variant-numeric:tabular-nums;
}
/* gilded progress thread (word goal) */
.thread{margin-top:12px}
.thread .track{height:2px;background:var(--hair);border-radius:1px;overflow:hidden}
.thread .fill{height:100%;background:var(--gild);border-radius:1px;transition:width .4s ease}
.thread .cap{margin-top:6px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- lists ---------- */
.list{padding:6px 12px}
.row{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;
  padding:13px 10px 13px 14px;
  border-radius:14px;
  position:relative;
}
.row:active{background:var(--press)}
.row + .row::before{
  content:"";position:absolute;left:14px;right:10px;top:0;
  border-top:.5px solid var(--hair2);
}
.row .body{flex:1;min-width:0}
.row .t{
  font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row .t.untitled{color:var(--ink3);font-style:italic;font-weight:400}
.row .s{margin-top:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .aux{flex:none;display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.row .chev{width:8px;height:14px;flex:none}
.row .chev svg{width:8px;height:14px;stroke:var(--ink3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.minibar{margin-top:7px;height:2px;background:var(--hair2);border-radius:1px;overflow:hidden;max-width:220px}
.minibar i{display:block;height:100%;background:var(--gild)}

/* status dots */
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.draft{border:1.5px solid var(--ink3)}
.dot.revised{background:var(--gild)}
.dot.final{background:var(--green)}

/* chapter blocks */
.chapter-block{margin-top:10px}
.ch-head{
  display:flex;align-items:center;gap:8px;
  width:100%;text-align:left;
  padding:10px 10px 8px 14px;
}
.ch-head:active{background:var(--press);border-radius:12px}
.ch-head .name{
  flex:1;min-width:0;
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-head .cnt{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ch-head .add{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gild)}
.ch-head .add:active{background:var(--press)}
.ch-head .add svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

/* edit-mode affordances */
.handle{
  width:36px;height:36px;flex:none;border-radius:10px;
  display:none;align-items:center;justify-content:center;
  color:var(--ink3);touch-action:none;
}
.handle svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.del{
  width:26px;height:26px;flex:none;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  background:var(--red);color:#fff;
}
.del svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.editing .handle,.editing .del{display:flex}
.editing .row .chev{display:none}
.row.dragging{opacity:.35}
.ghost{
  position:fixed;left:0;top:0;z-index:200;pointer-events:none;
  background:var(--sheet);border-radius:14px;box-shadow:0 10px 30px rgba(20,15,8,.25);
  padding:13px 14px;display:flex;align-items:center;gap:12px;width:auto;
}

/* ---------- bottom toolbars (per screen) ---------- */
.toolbar{
  position:absolute;left:0;right:0;bottom:0;z-index:9;
  display:flex;align-items:center;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);
  backdrop-filter:saturate(1.6) blur(18px);
  border-top:.5px solid var(--hair);
}
.toolbar .stat{flex:1;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.toolbar .bbtn{color:var(--gild)}

/* ---------- empty states ---------- */
.empty{
  padding:80px 32px;text-align:center;color:var(--ink2);
}
.empty .mark{font-family:var(--serif);font-size:34px;color:var(--gild);opacity:.85}
.empty h2{font-family:var(--serif);font-weight:600;font-size:20px;margin-top:14px;color:var(--ink)}
.empty p{margin-top:6px;font-size:14px;line-height:1.5}
.empty .cta{
  margin-top:20px;display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:999px;
  background:var(--gild);color:var(--paper);
  font-weight:600;font-size:15px;
}
.empty .cta:active{opacity:.85}
.empty .cta.secondary{
  background:transparent;color:var(--gild);
  border:1px solid var(--gild);box-shadow:none;margin-top:12px;
}
.empty .hint{margin-top:14px;font-size:12px;color:var(--ink3)}

/* ---------- import preview ---------- */
.imp-src{text-align:center;font-size:12px;color:var(--ink3);padding:0 16px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-stats{text-align:center;font-size:13px;color:var(--ink2);padding:4px 0 10px;font-variant-numeric:tabular-nums}
.seg-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:2px 18px 6px}
.seg{display:flex;gap:6px;margin:0 16px 12px}
.seg button{
  flex:1;padding:9px 6px;border-radius:10px;
  border:1px solid var(--hair);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink2);
}
.seg button.on{background:var(--gild);border-color:var(--gild);color:var(--paper)}
.seg button:active{opacity:.8}
.imp-tree{
  margin:0 16px 12px;border:1px solid var(--hair2);border-radius:12px;
  max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface);
}
.imp-tree .tr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;border-bottom:.5px solid var(--hair2)}
.imp-tree .tr:last-child{border-bottom:none}
.imp-tree .tt{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-tree .tc{color:var(--ink3);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.imp-tree .tr.more .tt{font-weight:400;color:var(--ink3);font-size:13px}

/* ---------- editor ---------- */
#scr-editor .scroll{padding-bottom:180px}
.ed-wrap{max-width:660px;margin:0 auto;padding:10px 22px 0}
#ed-title{
  font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.25;
  letter-spacing:-.01em;
  min-height:1.3em;position:relative;
  overflow-wrap:break-word;
}
#ed-title[data-empty="1"]::before{
  content:"Scene title";color:var(--ink3);position:absolute;pointer-events:none;
}
.ed-meta{
  display:flex;align-items:center;gap:10px;
  margin:10px 0 4px;
  font-size:13px;color:var(--ink2);
  font-variant-numeric:tabular-nums;
  transition:opacity .25s;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  border:.5px solid var(--hair);
  font-size:12px;font-weight:500;color:var(--ink2);
}
.chip:active{background:var(--press)}
.ed-rule{height:.5px;background:var(--hair);margin:8px 0 18px}
#ed-content{
  font-family:var(--serif);
  font-size:18px;line-height:1.62;
  min-height:44vh;
  caret-color:var(--gild);
  position:relative;
  overflow-wrap:break-word;
}
#ed-content[data-empty="1"]::before{
  content:"Begin the scene…";color:var(--ink3);position:absolute;pointer-events:none;
}
#ed-content p, #ed-content div{margin:0 0 .9em}
#ed-content h2{font-size:22px;font-weight:700;margin:1.2em 0 .5em;line-height:1.3}
#ed-content h3{font-size:19px;font-weight:600;margin:1.1em 0 .45em;line-height:1.3;color:var(--ink);opacity:.92}
#ed-content blockquote{
  margin:0 0 .9em;padding:2px 0 2px 16px;
  border-left:2px solid var(--gild);
  color:var(--ink2);font-style:italic;
}
#ed-content ul,#ed-content ol{margin:0 0 .9em;padding-left:1.5em}
#ed-content li{margin:0 0 .3em}
#ed-content .sc{font-variant:small-caps;letter-spacing:.03em}
#ed-content .asterism{
  text-align:center;color:var(--gild);
  font-size:19px;letter-spacing:.35em;text-indent:.35em;
  margin:1.3em 0;user-select:none;
}
/* manuscript paragraph mode: first-line indent, no gaps */
.para-indent #ed-content p,.para-indent #ed-content div{margin:0;text-indent:1.5em}
.para-indent #ed-content p:first-child,
.para-indent #ed-content h2 + p,.para-indent #ed-content h3 + p,
.para-indent #ed-content .asterism + p,
.para-indent #ed-content blockquote + p{text-indent:0}
.para-indent #ed-content h2,.para-indent #ed-content h3,
.para-indent #ed-content blockquote,.para-indent #ed-content ul,
.para-indent #ed-content ol{margin-bottom:.9em}
.para-indent #ed-content .asterism{margin:1.3em 0}

/* ---------- cards ---------- */
.ci{
  width:34px;height:34px;flex:none;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gild-soft);color:var(--gild);
}
.ci svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cd-search{padding:0 16px 8px}
.cd-search input{
  width:100%;padding:9px 14px;border-radius:11px;
  border:.5px solid var(--hair);background:var(--surface);
  font-size:15px;color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
.cd-search input::placeholder{color:var(--ink3)}
.cd-filters{
  display:flex;gap:7px;padding:0 16px 10px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.cd-filters::-webkit-scrollbar{display:none}
.fchip{
  flex:none;padding:6px 13px;border-radius:999px;
  border:.5px solid var(--hair);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink2);
}
.fchip.on{background:var(--gild);border-color:var(--gild);color:var(--paper)}
.cd-group{
  padding:16px 18px 6px;font-size:12px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
}
/* ---------- card detail ---------- */
#cc-title{
  font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.25;
  letter-spacing:-.01em;min-height:1.3em;position:relative;overflow-wrap:break-word;
}
#cc-title[data-empty="1"]::before{
  content:"Card name";color:var(--ink3);position:absolute;pointer-events:none;
}
.cc-sec{margin:20px 0 0}
.cc-h{
  font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:8px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipx{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;border-radius:999px;
  border:.5px solid var(--hair);background:var(--surface);
  font-size:13px;color:var(--ink);
}
.chipx b{font-weight:400;color:var(--ink3);font-size:15px;line-height:1;padding:2px}
.chipx:active{background:var(--press)}
.chipadd{
  display:inline-flex;align-items:center;
  padding:5px 11px;border-radius:999px;
  border:.5px dashed var(--hair);
  font-size:13px;color:var(--gild);font-weight:500;
}
#cc-notes{
  font-family:var(--serif);font-size:16.5px;line-height:1.6;
  min-height:72px;position:relative;overflow-wrap:break-word;
  caret-color:var(--gild);
}
#cc-notes[data-empty="1"]::before{
  content:"Notes on this card…";color:var(--ink3);position:absolute;pointer-events:none;
}
#cc-notes p,#cc-notes div{margin:0 0 .7em}
#cc-notes blockquote{margin:0 0 .7em;padding:2px 0 2px 14px;border-left:2px solid var(--gild);color:var(--ink2);font-style:italic}
#cc-notes ul,#cc-notes ol{margin:0 0 .7em;padding-left:1.4em}
#cc-notes .sc{font-variant:small-caps;letter-spacing:.03em}
.quote-row{margin:0 0 14px}
.quote-row blockquote{
  margin:0;padding:2px 0 2px 14px;border-left:2px solid var(--gild);
  font-family:var(--serif);font-size:15.5px;line-height:1.55;font-style:italic;color:var(--ink);
}
.q-src{display:flex;align-items:center;gap:14px;margin:6px 0 0 16px}
.q-src button{font-size:12.5px;color:var(--ink3)}
.q-src button[data-goto]{color:var(--gild);font-weight:500}
.q-src button:active{opacity:.7}
.ment{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  width:100%;padding:9px 0;border-bottom:.5px solid var(--hair2);
  text-align:left;
}
.ment:last-child{border-bottom:none}
.ment .mt{font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ment .mc{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.ment:active{opacity:.7}
.cc-none{font-size:13px;color:var(--ink3);line-height:1.5}
/* ---------- tenebrae translation ---------- */
.tspan[data-omni][data-lang]{font-family:var(--serif);font-style:normal}
.tspan .tn-w{display:inline-block;vertical-align:-.38em;line-height:0}
.tspan .tn-w svg{height:1.55em;width:auto;display:block}
.tspan .tn-w.v{vertical-align:middle}
.tspan .tn-w.v svg{width:.92em;height:auto}
.tspan .tn-p{opacity:.82}
.tspan .tn-unk{border-bottom:1px dotted currentColor;opacity:.9}
.tsr{padding:10px 2px 4px;line-height:2.1}
.tsr .tn-w{display:inline-block;vertical-align:middle;line-height:0;margin:0 2px}
.tsr .tn-w svg{height:40px;width:auto;display:block}
.tsr .tn-w.v svg{height:auto;width:26px}
.tsr .tn-unk{border-bottom:1px dotted var(--gild);opacity:.85}
.tspan{
  display:inline;padding:1px 5px 2px;border-radius:5px;
  background:var(--gild-soft);
  box-shadow:inset 0 0 0 .5px color-mix(in srgb, var(--gild) 35%, transparent);
  unicode-bidi:isolate;
  -webkit-user-modify:read-only;
}
.tspan:active{background:var(--press)}
.ts-src{
  font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;
  color:var(--ink);margin:2px 0 10px;
}
.ts-rom{font-size:14px;color:var(--ink2);margin-bottom:12px}
.ts-rom b{color:var(--gild);font-weight:600}
.gloss{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:4px}
.gloss .g{display:flex;flex-direction:column;gap:1px}
.gloss .g .gs{font-size:11px;color:var(--ink3)}
.gloss .g .go{font-size:13.5px;color:var(--ink)}
.gloss .g.unk .go{color:var(--ink3)}
.cx-badge{
  display:inline-block;padding:2px 8px;border-radius:999px;
  background:var(--gild-soft);color:var(--gild);
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
}

/* ---------- desktop (Chrome-friendly testing frame) ---------- */
@media (min-width: 700px){
  :root{ --deskw: 442px; --deske: calc(50vw - var(--deskw) / 2); }
  body{ background:#E8E1D2; }
  #app{
    left:var(--deske); right:auto; width:var(--deskw);
    box-shadow:0 0 0 .5px var(--hair), 0 24px 70px rgba(28,22,14,.22);
  }

<script>
(function(){
"use strict";

/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n || 0).toLocaleString();
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? '' : 's'}`;

function countWords(text){
  const m = String(text || '').match(/[\p{L}\p{N}]+(?:[''\-][\p{L}\p{N}]+)*/gu);
  return m ? m.length : 0;
}
function textOf(el){
  if(typeof el.innerText === 'string') return el.innerText;
  const BLOCKS = /^(P|DIV|H1|H2|H3|BLOCKQUOTE|UL|OL|LI)$/;
  let out = '';
  (function walk(n){
    n.childNodes.forEach(c => {
      if(c.nodeType === 3){ out += c.nodeValue; return; }
      if(c.nodeType !== 1) return;
      if(c.tagName === 'BR'){ out += '\n'; return; }
      walk(c);
      if(BLOCKS.test(c.tagName)) out += '\n';
    });
  })(el);
  return out;
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= storage (IndexedDB → in-memory fallback) ================= */
const mem = new Map();
let db = null, idbOK = false;

function idbOpen(){
  return new Promise(resolve => {
    try{
      const req = indexedDB.open('tenebrae-writer', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
      req.onsuccess = () => { db = req.result; idbOK = true; resolve(); };
      req.onerror = () => resolve();
      req.onblocked = () => resolve();
      setTimeout(resolve, 2500); // safety: never hang boot
    }catch(e){ resolve(); }
  });
}
function kvGet(key){
  if(idbOK && db){
    return new Promise(resolve => {
      try{
        const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => resolve(mem.get(key));
      }catch(e){ resolve(mem.get(key)); }
    });
  }
  return Promise.resolve(mem.get(key));
}
function kvSet(key, val){
  mem.set(key, val); // always mirror in memory
  if(idbOK && db){
    return new Promise(resolve => {
      try{
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  return Promise.resolve(false);
}

/* -------- autosave -------- */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}
function flushSave(){
  // keystrokes younger than the input debounce live only in the editor DOM —
  // pull them into state before snapshotting, or a hide+discard loses them
  try{ persistEditor(); persistCard(); }catch(e){}
  clearTimeout(saveTimer); saveTimer = null;

}

/* ================= sanitizer ================= */
const BLOCK_KEEP = new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','DEL','H2','H3','BLOCKQUOTE','UL','OL','LI']);
function sanitizeHTML(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const frag = tpl.content;
  frag.querySelectorAll('script,style,link,meta,iframe,object,embed,svg,img,video,audio,form,input,button,textarea').forEach(n => n.remove());
  const walk = node => {
    const kids = Array.from(node.childNodes);
    for(const child of kids){
      if(child.nodeType === 3) continue;
      if(child.nodeType !== 1){ child.remove(); continue; }
      walk(child);
      const tag = child.tagName;
      if(tag === 'DIV' && child.classList.contains('asterism')){
        const d = document.createElement('div');
        d.className = 'asterism'; d.setAttribute('contenteditable', 'false'); d.textContent = '⁂';
        child.replaceWith(d); continue;
      }
      if(tag === 'SPAN'){
        if(child.classList.contains('tspan') && child.dataset.src && child.dataset.lang){
          const t = document.createElement('span');
          t.className = 'tspan';
          t.dataset.lang = String(child.dataset.lang).replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
          t.dataset.src = String(child.dataset.src).slice(0, 2000);
          t.dataset.rom = String(child.dataset.rom || '').slice(0, 4000);
          if(child.dataset.scr) t.dataset.scr = String(child.dataset.scr).slice(0, 4000);
          if(child.dataset.flow) t.dataset.flow = String(child.dataset.flow).replace(/[^a-z-]/g, '').slice(0, 16);
          if(child.dataset.omni) t.dataset.omni = '1';
          if(child.getAttribute('dir') === 'rtl') t.setAttribute('dir', 'rtl');
          t.setAttribute('contenteditable', 'false');
          t.textContent = child.dataset.omni
            ? (child.dataset.scr || child.dataset.rom || '')
            : (child.textContent || child.dataset.rom || '');
          child.replaceWith(t); continue;
        }
        const sc = child.classList.contains('sc') || /small-caps/.test(child.getAttribute('style') || '');
        if(sc){
          const s = document.createElement('span'); s.className = 'sc';
          while(child.firstChild) s.appendChild(child.firstChild);
          child.replaceWith(s);
        }else{
          unwrap(child);
        }
        continue;
      }
      if(tag === 'DIV'){ // stray divs become paragraphs
        const p = document.createElement('p');
        while(child.firstChild) p.appendChild(child.firstChild);
        child.replaceWith(p); continue;
      }
      if(tag === 'H1'){
        const h = document.createElement('h2');
        while(child.firstChild) h.appendChild(child.firstChild);
        child.replaceWith(h); continue;
      }
      if(!BLOCK_KEEP.has(tag)){ unwrap(child); continue; }
      // strip all attributes
      for(const a of Array.from(child.attributes)) child.removeAttribute(a.name);
    }
  };
  function unwrap(el){
    const parent = el.parentNode;
    while(el.firstChild) parent.insertBefore(el.firstChild, el);
    el.remove();
  }
  walk(frag);
  // contenteditable leaves the first typed line as a bare top-level run;
  // exporters can only see paragraphs, so every stray inline run gets a <p>
  const TOP_BLOCK = /^(P|H2|H3|BLOCKQUOTE|UL|OL|DIV)$/;
  let run = null;
  for(const node of Array.from(frag.childNodes)){
    if(node.nodeType === 1 && TOP_BLOCK.test(node.tagName)){ run = null; continue; }
    if(!run && node.nodeType === 3 && !node.nodeValue.trim()){ node.remove(); continue; }
    if(!run){ run = document.createElement('p'); frag.insertBefore(run, node); }
    run.appendChild(node);
  }
  const out = document.createElement('div');
  out.appendChild(frag);
  return out.innerHTML;
}

/* ================= navigation ================= */
const scr = { library: $('#scr-library'), book: $('#scr-book'), cards: $('#scr-cards'), card: $('#scr-card'), editor: $('#scr-editor') };
let navStack = ['library'];
let currentBookId = null, currentSceneId = null;

function applyNav(){
  const top = navStack[navStack.length - 1];
  for(const key of Object.keys(scr)){
    const el = scr[key];
    const idx = navStack.indexOf(key);
    el.classList.remove('on', 'under');
    // stacking must follow the navigation order, not the fixed CSS hierarchy —
    // editor→card layers the card above the editor it was opened from
    el.style.zIndex = idx > -1 ? String(idx + 1) : '';
    if(key === top) el.classList.add('on');
    else if(idx > -1) el.classList.add('under');
  }
  if(top !== 'editor' && document.body.classList.contains('zen')) setZen(false);
  syncFbar();
}
function push(name){ if(navStack[navStack.length-1] !== name){ navStack.push(name); applyNav(); } }
function pop(){
  if(navStack.length > 1){
    const leaving = navStack.pop();
    if(leaving === 'editor') closeEditor();
    if(leaving === 'card') persistCard();
    applyNav();
    const top = navStack[navStack.length - 1];
    if(top === 'book') renderBook();
    if(top === 'library') renderLibrary();
    if(top === 'cards') renderCards();
    if(top === 'card') renderCard();
  }
}

/* ================= drag to reorder ================= */
function bindDrag(container, itemSel, _unused, commit, handleKind, idAttr){
  container.querySelectorAll(`.handle[data-drag="${handleKind}"]`).forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      const item = handle.closest(itemSel); if(!item) return;
      e.preventDefault(); e.stopPropagation();
      startDrag(e, container, item, itemSel, commit, idAttr || 'book');
    });
  });
}
function startDrag(e, container, item, itemSel, commit, idAttr){
  const rect = item.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.style.width = rect.width + 'px';
  ghost.innerHTML = item.innerHTML;
  ghost.querySelectorAll('.del,.handle').forEach(n => n.style.visibility = 'hidden');
  document.body.appendChild(ghost);
  const offY = e.clientY - rect.top;
  const offX = e.clientX - rect.left;
  item.classList.add('dragging');
  const move = ev => {
    ghost.style.transform = `translate(${ev.clientX - offX}px, ${ev.clientY - offY}px)`;
    const siblings = Array.from(container.querySelectorAll(itemSel)).filter(n => n !== item);
    let placed = false;
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(ev.clientY < r.top + r.height / 2){
        if(item.nextElementSibling !== sib) sib.parentNode.insertBefore(item, sib);
        placed = true; break;
      }
    }
    if(!placed && siblings.length){
      const last = siblings[siblings.length - 1];
      if(last.nextElementSibling !== item) last.parentNode.insertBefore(item, last.nextElementSibling);
    }
  };
  move(e);
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    ghost.remove();
    item.classList.remove('dragging');
    const order = Array.from(container.querySelectorAll(itemSel)).map(n => n.dataset[idAttr]);
    commit(order);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

const edScroll = $('#ed-scroll');

function statusLabel(s){ return s === 'revised' ? 'Revised' : s === 'final' ? 'Final' : 'Draft'; }

function openEditor(sceneId){

function closeEditor(){

  document.body.classList.remove('para-indent');
  currentSceneId = null;
  hideFbarNow();
}

function currentScene(){
  const b = bookById(currentBookId); if(!b || !currentSceneId) return null;
  const f = findScene(b, currentSceneId);

}

function persistEditor(){
  const s = currentScene(); if(!s) return;
  s.title = edTitle.textContent.trim();
  s.doc = sanitizeHTML(edContent.innerHTML);
  s.words = countWords(textOf(edContent));
  s.updated = Date.now();
  const b = bookById(currentBookId); if(b) b.updated = Date.now();
  scheduleSave();
}

function updateCount(){

  $('#ed-count').textContent = plural(n, 'word');
}
function setStatusUI(status){

  $('#ed-statuslabel').textContent = statusLabel(status);
}
function syncEmpty(){
  edTitle.dataset.empty = edTitle.textContent.trim() ? '0' : '1';
  const hasContent = edContent.textContent.trim() || edContent.querySelector('.asterism');
  edContent.dataset.empty = hasContent ? '0' : '1';
}

let edInputTimer = null;
function onEdInput(){
  editorDirty = true;
  syncEmpty();
  clearTimeout(edInputTimer);
  edInputTimer = setTimeout(() => { updateCount(); persistEditor(); }, 450);
}
edContent.addEventListener('input', onEdInput);
edTitle.addEventListener('input', () => {
  syncEmpty();
  $('#ed-bartitle').textContent = edTitle.textContent.trim() || 'Untitled scene';
  clearTimeout(edInputTimer);
  edInputTimer = setTimeout(persistEditor, 450);
});
edTitle.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); edContent.focus(); placeCaretEnd(edContent); }
});
edTitle.addEventListener('paste', e => {
  e.preventDefault();
  const t = (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ').trim();
  document.execCommand('insertText', false, t);
});
edContent.addEventListener('paste', e => {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  if(html){
    document.execCommand('insertHTML', false, sanitizeHTML(html));
  }else{
    const t = e.clipboardData.getData('text/plain') || '';
    document.execCommand('insertText', false, t);
  }
  onEdInput();
});

function placeCaretEnd(el){
  const r = document.createRange();
  r.selectNodeContents(el); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

/* -------- formatting commands -------- */
function inContent(){
  const sel = getSelection();
  if(!sel.rangeCount) return false;
  const n = sel.anchorNode;
  return n && edContent.contains(n.nodeType === 1 ? n : n.parentNode);
}
function cmd(name){
  if(!inContent()){ edContent.focus(); }
  document.execCommand(name, false, null);
  onEdInput(); refreshFbar();
}
function setBlock(tag){
  if(!inContent()) edContent.focus();
  const cur = currentBlockTag();
  const target = (cur === tag) ? 'p' : tag;
  document.execCommand('formatBlock', false, '<' + target + '>');
  onEdInput(); refreshFbar();
}
function currentBlockTag(){
  const sel = getSelection();
  if(!sel.rangeCount) return 'p';
  let n = sel.anchorNode;
  if(n && n.nodeType === 3) n = n.parentNode;
  while(n && n !== edContent){
    const t = n.tagName;
    if(t === 'H2' || t === 'H3' || t === 'BLOCKQUOTE') return t.toLowerCase();
    n = n.parentNode;
  }
  return 'p';
}
function insertBreak(){
  edContent.focus();
  document.execCommand('insertHTML', false,
    '<div class="asterism" contenteditable="false">⁂</div><p><br></p>');
  onEdInput();
}

/* small caps: sentinel-font trick, then swap for span.sc */
function toggleSmallCaps(){
  const sel = getSelection();
  if(!sel.rangeCount || sel.isCollapsed || !inContent()){
    toast('Select text first'); return;
  }
  document.execCommand('fontName', false, '__SC__');
  edContent.querySelectorAll('font').forEach(f => {
    if(f.getAttribute('face') !== '__SC__'){ return; }
    const insideSC = f.closest('span.sc');
    if(insideSC){
      // unwrap the sentinel, then lift small caps off the containing run
      while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
      f.remove();
      const parent = insideSC.parentNode;
      while(insideSC.firstChild) parent.insertBefore(insideSC.firstChild, insideSC);
      insideSC.remove();
    }else{
      const s = document.createElement('span');
      s.className = 'sc';
      while(f.firstChild) s.appendChild(f.firstChild);
      f.replaceWith(s);
    }
  });
  // cleanup empties
  edContent.querySelectorAll('span.sc').forEach(s => { if(!s.textContent) s.remove(); });
  onEdInput(); refreshFbar();
}

const fbar = $('#fbar');

let kbOffset = 0;
let fbarVisible = false;

function syncFbar(){
  const top = navStack[navStack.length - 1];
  const active = document.activeElement;
  const editing = top === 'editor' && (active === edContent || active === edTitle || fbarHolding);
  if(editing && !fbarVisible){
    fbarVisible = true;
    fbar.classList.add('show');

    fbarVisible = false;
    fbar.classList.remove('show');
    aaPanel.classList.remove('open');

  }
}

  fbarVisible = false;
  fbar.classList.remove('show');
  aaPanel.classList.remove('open');
  $('#fb-aa').classList.remove('on');
}
let fbarHolding = false; // true briefly while tapping bar buttons
document.addEventListener('focusin', () => requestAnimationFrame(syncFbar));
document.addEventListener('focusout', () => setTimeout(syncFbar, 60));

// keep bar above the keyboard
if(window.visualViewport){
  const vv = window.visualViewport;
  const track = () => {
    kbOffset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    fbar.style.setProperty('--kb', -kbOffset + 'px');
    fbar.classList.toggle('kb', kbOffset > 60);
    document.documentElement.style.setProperty('--kbs', -kbOffset + 'px');
    edScroll.style.paddingBottom = (kbOffset > 60 ? kbOffset + 90 : 180) + 'px';
  };
  vv.addEventListener('resize', track);
  vv.addEventListener('scroll', track);
  track();
}

function refreshFbar(){
  if(!fbarVisible) return;
  const map = { bold: '.mark-b', italic: '.mark-i', underline: '.mark-u', strikeThrough: '.mark-s',
                insertUnorderedList: '[data-cmd="insertUnorderedList"]', insertOrderedList: '[data-cmd="insertOrderedList"]' };
  for(const k in map){
    let on = false;
    try{ on = document.queryCommandState(k); }catch(e){}
    const el = fbar.querySelector(map[k]);
    if(el) el.classList.toggle('on', on);
  }
  // small caps
  let scOn = false;
  const sel = getSelection();
  if(sel.rangeCount){
    let n = sel.anchorNode;
    if(n && n.nodeType === 3) n = n.parentNode;
    scOn = !!(n && n.closest && n.closest('span.sc'));
  }
  $('#fb-sc').classList.toggle('on', scOn);
  // block segment
  const cur = currentBlockTag();
  $('#seg-block').querySelectorAll('[data-block]').forEach(b => {
    b.classList.toggle('on', b.dataset.block === cur);
  });
}

function itemsHTML(items){
  return `<div class="sheet-scroll">` + items.map((it, i) => {
    if(it.note) return `<div class="sheet-note">${it.note}</div>`;
    return `<button class="sh-item ${it.destructive ? 'destructive' : ''} ${it.checked ? 'checked' : ''}" data-i="${i}">
      ${it.icon ? it.icon : ''}
      <span class="lbl">${esc(it.label)}</span>
      <span class="check">${ICONS.check}</span>
    </button>`;
  }).join('') + `</div>`;
}
function actionSheet(title, items){
  openSheetHTML(`${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}${itemsHTML(items)}`);
  sheet.querySelectorAll('[data-i]').forEach(btn => {
    btn.addEventListener('click', () => {
      const it = items[+btn.dataset.i];
      if(it.keepOpen){ it.onTap && it.onTap(); }
      else if(it.immediate){ it.onTap && it.onTap(); closeSheet(); }
      else { closeSheet(); setTimeout(() => it.onTap && it.onTap(), 120); }
    });
  });
}

      ${numeric ? 'inputmode="numeric" pattern="[0-9]*"' : 'autocapitalize="words"'} enterkeyhint="done">
    <div class="sheet-actions">

      <button id="ps-save" class="primary">${esc(saveLabel)}</button>

function transformExportHTML(doc){

/* HTML → Markdown */
function mdEscape(t){ return t.replace(/([\\`*_~\[\]<])/g, '\\$1'); }
function mdGuardLines(t){
  // a prose line must not open with a block marker, or renderers — and our
  // own importer — read it as structure (heading, quote, list item)
  return t.split('\n').map(l =>
    l.replace(/^(\s{0,3})(#{1,6}(?=[ \t])|>|[-+](?=[ \t]))/, '$1\\$2')
     .replace(/^(\s{0,3})(\d{1,9})([.)])(?=[ \t])/, '$1$2\\$3')
  ).join('\n');
}
function mdInline(node){
  let out = '';
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){ out += mdEscape(n.nodeValue); return; }
    if(n.nodeType !== 1) return;
    if(n.classList && n.classList.contains('tspan') && n.dataset && n.dataset.src){
      const meta = JSON.stringify({ language: n.dataset.lang, source: n.dataset.src }).replace(/--/g, '\\u002d\\u002d');
      out += `<!--tenebrae:begin ${meta}-->${mdEscape(n.dataset.rom || n.textContent)}<!--tenebrae:end-->`;
      return;
    }
    const inner = mdInline(n);
    // CommonMark rejects emphasis whose delimiter touches a space — move
    // boundary whitespace outside the markers ('<b>bold </b>x' → '**bold** x')
    const wrapM = d => {
      const m = inner.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[1] + d + m[2] + d + m[3];
    };
    switch(n.tagName){
      case 'B': case 'STRONG': out += inner.trim() ? wrapM('**') : inner; break;
      case 'I': case 'EM': out += inner.trim() ? wrapM('*') : inner; break;
      case 'S': case 'STRIKE': case 'DEL': out += inner.trim() ? wrapM('~~') : inner; break;
      case 'U': out += inner.trim() ? `<u>${inner}</u>` : inner; break;
      case 'SPAN': out += inner; break; // small caps → plain text in md
      case 'BR': out += '  \n'; break;
      default: out += inner;
    }
  });
  return out;
}
function mdFromDoc(doc){
  const tpl = document.createElement('template');
  tpl.innerHTML = doc || '';
  let out = '';
  tpl.content.childNodes.forEach(n => {
    if(n.nodeType === 3){ const t = n.nodeValue.trim(); if(t) out += mdGuardLines(mdEscape(t)) + '\n\n'; return; }
    if(n.nodeType !== 1) return;
    const tag = n.tagName;
    if(tag === 'DIV' && n.classList.contains('asterism')){ out += '⁂\n\n'; return; }
    if(tag === 'P' || tag === 'DIV'){ const t = mdGuardLines(mdInline(n).trim()); out += (t ? t : '') + '\n\n'; return; }
    if(tag === 'H2'){ out += '### ' + mdInline(n).trim() + '\n\n'; return; }
    if(tag === 'H3'){ out += '#### ' + mdInline(n).trim() + '\n\n'; return; }
    if(tag === 'BLOCKQUOTE'){
      const t = mdInline(n).trim().split('\n').map(l => '> ' + mdGuardLines(l)).join('\n');
      out += t + '\n\n'; return;
    }
    if(tag === 'UL' || tag === 'OL'){
      let i = 1;
      n.querySelectorAll(':scope > li').forEach(li => {
        out += (tag === 'UL' ? '- ' : `${i++}. `) + mdGuardLines(mdInline(li).trim()) + '\n';
      });
      out += '\n'; return;
    }
    // docs saved before top-level runs were wrapped can still carry a bare
    // inline node here; serialize it through a wrapper so its own tag counts
    const wrap = document.createElement('div');
    wrap.appendChild(n.cloneNode(true));
    const t = mdGuardLines(mdInline(wrap).trim()); if(t) out += t + '\n\n';
  });
  return out.replace(/\n{3,}/g, '\n\n').trim();
}
function plainFromDoc(doc){
  const tpl = document.createElement('div');
  tpl.innerHTML = doc || '';
  tpl.querySelectorAll('div.asterism').forEach(d => d.textContent = '\n⁂\n');
  tpl.querySelectorAll('.tspan').forEach(t => t.textContent = t.dataset.rom || t.textContent);
  // innerText of a detached element has no block separators — walk blocks explicitly
  const BLOCKS = /^(P|DIV|H2|H3|BLOCKQUOTE|UL|OL)$/;
  let out = '';
  (function walk(n){
    n.childNodes.forEach(c => {
      if(c.nodeType === 3){ out += c.nodeValue; return; }
      if(c.nodeType !== 1) return;
      if(c.tagName === 'BR'){ out += '\n'; return; }
      walk(c);
      if(c.tagName === 'LI'){ out += '\n'; return; }
      if(BLOCKS.test(c.tagName)) out += '\n\n';
    });
  })(tpl);
  return out.replace(/\n{3,}/g, '\n\n').trim();
}

function compile(book, kind){
  // kind: 'md' | 'txt' | 'html'
  const o = book.exportOpts || defaultExportOpts();
  const sep = o.asterism
    ? { md: '\n\n⁂\n\n', txt: '\n\n⁂\n\n', html: '<p style="text-align:center;letter-spacing:.3em">⁂</p>' }
    : { md: '\n\n', txt: '\n\n', html: '<p><br></p>' };
  const parts = [];
  if(kind === 'md') parts.push('# ' + mdEscape(book.title));
  else if(kind === 'txt') parts.push(book.title.toUpperCase());
  else parts.push(`<h1>${esc(book.title)}</h1>`);

  book.chapters.forEach(ch => {
    const chunk = [];
    if(o.chapterTitles){
      if(kind === 'md') chunk.push('## ' + mdEscape(ch.title));
      else if(kind === 'txt') chunk.push(ch.title.toUpperCase());
      else chunk.push(`<h2>${esc(ch.title)}</h2>`);
    }
    const sceneParts = ch.scenes.map(s => {
      let body = kind === 'md' ? mdFromDoc(s.doc)
               : kind === 'txt' ? plainFromDoc(s.doc)
               : transformExportHTML(s.doc);
      if(o.sceneTitles && s.title){
        if(kind === 'md') body = '### ' + mdEscape(s.title) + '\n\n' + body;
        else if(kind === 'txt') body = s.title + '\n\n' + body;
        else body = `<h3>${esc(s.title)}</h3>` + body;
      }
      return body;
    }).filter(x => x && x.trim());
    chunk.push(sceneParts.join(sep[kind]));
    parts.push(chunk.join(kind === 'html' ? '' : '\n\n'));
  });
  return parts.join(kind === 'html' ? '' : '\n\n').trim();
}

function sceneExportData(kind){
  const s = currentScene(); if(!s) return null;
  const title = s.title || 'Untitled scene';
  if(kind === 'md') return { name: fileSafe(title) + '.md', text: (s.title ? '### ' + mdEscape(s.title) + '\n\n' : '') + mdFromDoc(s.doc) };
  if(kind === 'txt') return { name: fileSafe(title) + '.txt', text: (s.title ? s.title + '\n\n' : '') + plainFromDoc(s.doc) };
  return { name: title, html: (s.title ? `<h2>${esc(s.title)}</h2>` : '') + transformExportHTML(s.doc), text: (s.title ? s.title + '\n\n' : '') + plainFromDoc(s.doc) };
}
function fileSafe(t){ return (t || 'untitled').replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 60) || 'untitled'; }

function download(name, text, mime){
  try{
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 800);
    toast('Saved ' + name);
  }catch(e){ toast('Couldn’t save the file'); }
}
async function copyRich(html, plain){
  const wrapped = `<!doctype html><meta charset="utf-8"><body style="font-family:Georgia,serif">${html}</body>`;
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([wrapped], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' })
      })]);
      toast('Copied — paste into Apple Notes');
      return;
    }
    throw new Error('no rich clipboard');
  }catch(e){
    copyPlain(plain, 'Copied as plain text — paste into Notes');
  }
}
async function copyPlain(text, msg){
  try{
    await navigator.clipboard.writeText(text);
    toast(msg || 'Copied');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast(msg || 'Copied');
    }catch(e2){ toast('Couldn’t copy'); }
  }
}
async function shareOut(name, text){
  try{
    if(navigator.canShare && window.File){
      const f = new File([text], name, { type: 'text/plain' });
      if(navigator.canShare({ files: [f] })){
        await navigator.share({ files: [f], title: name });
        return;
      }
    }
    if(navigator.share){
      await navigator.share({ title: name, text });
      return;
    }
    throw new Error('no share');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    copyPlain(text, 'Sharing unavailable — copied instead');
  }
}

function exportSheet(scope){
  const b = bookById(currentBookId); if(!b) return;
  const o = b.exportOpts || (b.exportOpts = defaultExportOpts());
  const isBook = scope === 'book';
  const title = isBook ? b.title : (currentScene() && (currentScene().title || 'Untitled scene'));

  const items = [];
  if(isBook){
    items.push(
      { label: 'Include chapter titles', checked: o.chapterTitles, keepOpen: true, onTap: () => { o.chapterTitles = !o.chapterTitles; scheduleSave(); exportSheet('book'); } },
      { label: 'Include scene titles', checked: o.sceneTitles, keepOpen: true, onTap: () => { o.sceneTitles = !o.sceneTitles; scheduleSave(); exportSheet('book'); } },
      { label: '⁂ between scenes', checked: o.asterism, keepOpen: true, onTap: () => { o.asterism = !o.asterism; scheduleSave(); exportSheet('book'); } },
    );
  }
  items.push(
    { label: 'Copy for Apple Notes', icon: ICONS.copy, onTap: () => {
        if(isBook) copyRich(compile(b, 'html'), compile(b, 'txt'));
        else { const d = sceneExportData('html'); if(d) copyRich(d.html, d.text); }
      } },
    { label: 'Share…', icon: ICONS.share, onTap: () => {
        if(isBook) shareOut(fileSafe(b.title) + '.md', compile(b, 'md'));
        else { const d = sceneExportData('md'); if(d) shareOut(d.name, d.text); }
      } },
    { label: 'Download Markdown (.md)', icon: ICONS.md, onTap: () => {
        if(isBook) download(fileSafe(b.title) + '.md', compile(b, 'md'), 'text/markdown');
        else { const d = sceneExportData('md'); if(d) download(d.name, d.text, 'text/markdown'); }
      } },
    { label: 'Download plain text (.txt)', icon: ICONS.txt, onTap: () => {
        if(isBook) download(fileSafe(b.title) + '.txt', compile(b, 'txt'), 'text/plain');
        else { const d = sceneExportData('txt'); if(d) download(d.name, d.text, 'text/plain'); }
      } },
    { label: 'Download Word (.docx)', icon: ICONS.txt, onTap: () => {
        if(isBook) download(fileSafe(b.title) + '.docx', docxFile(b, 'book'), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        else { const s = currentScene(); if(s) download(fileSafe(s.title || 'untitled scene') + '.docx', docxFile(b, 'scene', s), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'); }
      } },
  );
  if(isBook){
    items.push(
      { label: 'Download EPUB (.epub)', icon: ICONS.book, onTap: async () => {
          // forge the codex script fonts first so they can ride inside the EPUB
          if(omniPack()){ try{ const w = await ensureOmni(); if(w) forgeOmniFonts(w); }catch(e){} }
          download(fileSafe(b.title) + '.epub', epubFile(b), 'application/epub+zip');
        } },
    );
  }
  if(isBook && (b.cards || []).length){
    items.push(
      { label: 'Story bible (.md)', icon: ICONS.cards, onTap: () => download(fileSafe(b.title) + ' — story bible.md', storyBibleMD(b), 'text/markdown') },
      { label: 'Cards archive (.zip)', icon: ICONS.json, onTap: () => downloadCardsZip(b) },
    );
  }
  items.push(
    { note: 'Rich copy keeps headings, bold and italics when pasted into Apple Notes. Tenebrae passages export as italic romanization; PDF and true-glyph typesetting arrive in a later step.' }
  );
  actionSheet(`Export — ${title}`, items);
}

/* ================= DOCX export =================
   OOXML written by hand against the app's own store-only zip writer, so the
   single-file / zero-dependency / offline architecture holds. Style ids are
   chosen to round-trip through docxToBlocks: Title, Heading1 (chapter),
   Heading2 (scene), Heading3/4 (in-scene H2/H3), Quote, ListBullet/ListNumber. */
function docxRunsFrom(node, inherit){
  const runs = [];
  const emit = (text, m) => {
    if(!text) return;
    let rpr = '';
    if(m.b) rpr += '<w:b/>';
    if(m.i) rpr += '<w:i/>';
    if(m.sc) rpr += '<w:smallCaps/>';
    if(m.s) rpr += '<w:strike/>';
    if(m.u) rpr += '<w:u w:val="single"/>';
    runs.push(`<w:r>${rpr ? `<w:rPr>${rpr}</w:rPr>` : ''}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`);
  };
  const walk = (n, m) => {
    n.childNodes.forEach(c => {
      if(c.nodeType === 3){ emit(c.nodeValue, m); return; }
      if(c.nodeType !== 1) return;
      const tag = c.tagName;
      if(tag === 'BR'){ runs.push('<w:r><w:br/></w:r>'); return; }
      if(tag === 'SPAN' && c.classList.contains('tspan')){
        // romanization in italics — glyph fidelity is the v1 spike, never raw PUA here
        emit(c.dataset.rom || c.textContent, Object.assign({}, m, { i: true }));
        return;
      }
      const m2 = Object.assign({}, m);
      if(tag === 'B' || tag === 'STRONG') m2.b = true;
      else if(tag === 'I' || tag === 'EM') m2.i = true;
      else if(tag === 'U') m2.u = true;
      else if(tag === 'S' || tag === 'STRIKE' || tag === 'DEL') m2.s = true;
      else if(tag === 'SPAN' && c.classList.contains('sc')) m2.sc = true;
      walk(c, m2);
    });
  };
  walk(node, inherit || {});
  return runs;
}
function docxPara(runs, opt){
  const o = opt || {};
  let ppr = '';
  if(o.style) ppr += `<w:pStyle w:val="${o.style}"/>`;
  if(o.num) ppr += `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${o.num}"/></w:numPr>`;
  if(o.jc) ppr += `<w:jc w:val="${o.jc}"/>`;
  return `<w:p>${ppr ? `<w:pPr>${ppr}</w:pPr>` : ''}${runs.join('')}</w:p>`;
}
const docxTextP = (text, opt) => docxPara([`<w:r><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`], opt);

function docxScenePs(doc){
  const tpl = document.createElement('template');
  tpl.innerHTML = doc || '';
  const ps = [];
  tpl.content.childNodes.forEach(n => {
    if(n.nodeType === 3){ const t = n.nodeValue.trim(); if(t) ps.push(docxTextP(t)); return; }
    if(n.nodeType !== 1) return;
    const tag = n.tagName;
    if(tag === 'DIV' && n.classList.contains('asterism')){ ps.push(docxTextP('⁂', { jc: 'center' })); return; }
    if(tag === 'H2'){ ps.push(docxPara(docxRunsFrom(n), { style: 'Heading3' })); return; }
    if(tag === 'H3'){ ps.push(docxPara(docxRunsFrom(n), { style: 'Heading4' })); return; }
    if(tag === 'BLOCKQUOTE'){ ps.push(docxPara(docxRunsFrom(n), { style: 'Quote' })); return; }
    if(tag === 'UL' || tag === 'OL'){
      n.querySelectorAll(':scope > li').forEach(li =>
        ps.push(docxPara(docxRunsFrom(li), tag === 'UL' ? { style: 'ListBullet', num: 1 } : { style: 'ListNumber', num: 2 })));
      return;
    }
    ps.push(docxPara(docxRunsFrom(n)));
  });
  return ps;
}
function docxBodyXML(book, scope, scene){
  const o = book.exportOpts || defaultExportOpts();
  const ps = [];
  if(scope === 'book'){
    ps.push(docxTextP(book.title, { style: 'Title' }));
    book.chapters.forEach(ch => {
      if(o.chapterTitles) ps.push(docxTextP(ch.title, { style: 'Heading1' }));
      const scenes = [];
      ch.scenes.forEach(s => {
        const body = docxScenePs(s.doc);
        if(!body.length && !s.title) return;
        scenes.push({ title: s.title, body });
      });
      scenes.forEach((s, i) => {
        if(i > 0 && o.asterism) ps.push(docxTextP('⁂', { jc: 'center' }));
        if(o.sceneTitles && s.title) ps.push(docxTextP(s.title, { style: 'Heading2' }));
        ps.push.apply(ps, s.body);
      });
    });
  }else{
    if(scene.title) ps.push(docxTextP(scene.title, { style: 'Heading2' }));
    ps.push.apply(ps, docxScenePs(scene.doc));
  }
  return ps.join('');
}
const DOCX_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const DOCX_STATIC = {
  ct: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>`,
  rels: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
  docRels: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>`,
  styles: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="${DOCX_W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="24"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="288" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="480" w:after="240"/><w:jc w:val="center"/></w:pPr><w:rPr><w:b/><w:sz w:val="44"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="160"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="36"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="28"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="100"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:sz w:val="26"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading4"><w:name w:val="heading 4"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="100"/><w:outlineLvl w:val="3"/></w:pPr><w:rPr><w:b/><w:i/><w:sz w:val="24"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Quote"><w:name w:val="Quote"/><w:basedOn w:val="Normal"/><w:pPr><w:ind w:left="720" w:right="720"/></w:pPr><w:rPr><w:i/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="ListBullet"><w:name w:val="List Bullet"/><w:basedOn w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="ListNumber"><w:name w:val="List Number"/><w:basedOn w:val="Normal"/></w:style></w:styles>`,
  numbering: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:numbering xmlns:w="${DOCX_W}"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num><w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num></w:numbering>`
};
function docxFile(book, scope, scene){
  const body = docxBodyXML(book, scope, scene) +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="${DOCX_W}"><w:body>${body}</w:body></w:document>`;
  return zipStore([
    { name: '[Content_Types].xml', data: DOCX_STATIC.ct },
    { name: '_rels/.rels', data: DOCX_STATIC.rels },
    { name: 'word/_rels/document.xml.rels', data: DOCX_STATIC.docRels },
    { name: 'word/styles.xml', data: DOCX_STATIC.styles },
    { name: 'word/numbering.xml', data: DOCX_STATIC.numbering },
    { name: 'word/document.xml', data: docXml },
  ]);
}

/* ================= EPUB export =================
   EPUB 3 via the same zip writer (mimetype first, stored — required). XHTML is
   built in a real XML document and serialized, so it is well-formed by
   construction. Translation spans are written as span.tspan with their data
   attributes: the app's own EPUB importer restores them as live spans, making
   the EPUB round trip lossless for conlang source text. */
const XHTML_NS = 'http://www.w3.org/1999/xhtml';
function epubXhtml(title, build){
  const d = document.implementation.createDocument(XHTML_NS, 'html', null);
  const head = d.createElementNS(XHTML_NS, 'head');
  const t = d.createElementNS(XHTML_NS, 'title');
  t.textContent = title || ' ';
  const link = d.createElementNS(XHTML_NS, 'link');
  link.setAttribute('rel', 'stylesheet'); link.setAttribute('type', 'text/css'); link.setAttribute('href', 'style.css');
  head.appendChild(t); head.appendChild(link);
  const body = d.createElementNS(XHTML_NS, 'body');
  d.documentElement.appendChild(head);
  d.documentElement.appendChild(body);
  build(d, body);
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n' + new XMLSerializer().serializeToString(d);
}
function epubSceneInto(d, body, sceneDoc){
  const mk = tag => d.createElementNS(XHTML_NS, tag);
  const inline = (src, dst) => {
    src.childNodes.forEach(c => {
      if(c.nodeType === 3){ dst.appendChild(d.createTextNode(c.nodeValue)); return; }
      if(c.nodeType !== 1) return;
      const tag = c.tagName;
      if(tag === 'BR'){ dst.appendChild(mk('br')); return; }
      if(tag === 'SPAN' && c.classList.contains('tspan')){
        const s = mk('span');
        s.setAttribute('class', 'tspan');
        if(c.dataset.lang) s.setAttribute('data-lang', c.dataset.lang);
        if(c.dataset.src) s.setAttribute('data-src', c.dataset.src);
        if(c.dataset.rom) s.setAttribute('data-rom', c.dataset.rom);
        if(c.dataset.flow) s.setAttribute('data-flow', c.dataset.flow);
        if(c.getAttribute('dir') === 'rtl') s.setAttribute('dir', 'rtl');
        // the script itself travels as TEXT — the EPUB embeds the script fonts;

/* romanization -> script text: PUA glyph runs, canonical ordering built in */
function omniScriptText(langId, toks){
  const f = omniForged && omniForged[langId];
  if(!f) return null;
  const words = [];
  let cur = [];
  for(const tk of toks){
    if(tk.sep){ if(cur.length){ words.push(cur); cur = []; } continue; }
    if(!tk.t) continue;
    cur.push(tk);
  }
  if(cur.length) words.push(cur);
  const wordStr = wtoks => wtoks.map(tk => {
    let s = '';
    for(const m of omniMatchWord(tk.t, f.matcher)){
      if(m.g && f.gidx[m.g.k.toLowerCase()] != null) s += String.fromCharCode(f.base + f.gidx[m.g.k.toLowerCase()]);
      else if(/\S/.test(m.t)) s += '·';
    }
    return s;
  }).join('');
  let strs = words.map(wordStr).filter(Boolean);
  if(f.flow === 'rtl'){ strs = strs.map(s => [...s].reverse().join('')).reverse(); } // PUA is strong-LTR: bake canonical order in
  if(f.flow === 'btt-stave'){ strs = strs.map(s => [...s].reverse().join('')); }    // first letter at the BOTTOM of the stave
  const vertical = f.flow === 'cols-rtl' || f.flow === 'btt-stave';
  return strs.join(vertical ? '\n' : ' '); // one column per word in vertical flows
}
function omniScriptCSS(){
  let style = $('#omni-style');
  if(!style){
    style = document.createElement('style');
    style.id = 'omni-style';
    document.head.appendChild(style);
  }
  const rules = [];
  if(omniForged){
    // [data-omni] included: the static .tspan[data-omni][data-lang] serif rule
    // would out-specify a bare [data-lang] selector
    for(const [langId, f] of Object.entries(omniForged)){
      rules.push(`.tspan[data-omni][data-lang="${langId}"]{font-family:'${f.family}';font-style:normal}`);
    }
    rules.push(`.tspan[data-omni][data-lang="celan_basic"]{font-family:'Tenebrae Celan Runes';font-style:normal}`);
  }
  rules.push(`.tspan[data-flow="cols-rtl"]{writing-mode:vertical-rl;text-orientation:upright;white-space:pre-line;line-height:1.05;vertical-align:middle;letter-spacing:0}`);
  rules.push(`.tspan[data-flow="btt-stave"]{writing-mode:vertical-lr;text-orientation:upright;white-space:pre-line;line-height:1.05;vertical-align:middle;letter-spacing:0}`);
  style.textContent = rules.join('\n');
}

  romanization. Claude is never involved. The engine is pure and
  data-driven; it runs on whatever Codex Pack is loaded. A clearly
  labeled sample pack ships built-in so the flow works end to end —
  importing the real Codex Omnilingua pack (JSON, or ZIP with fonts)
  replaces it without code changes. Every span keeps its source text

      pack = JSON.parse(new TextDecoder().decode(files.get(jsonName)));
      const fonts = [];
      for(const [n, data] of files){
        const m = n.match(/([^\/]+)\.(ttf|otf|woff2)$/i);
        if(m) fonts.push({ family: m[1], format: m[2].toLowerCase(), data: b64FromBytes(data) });
      }
      if(fonts.length) pack.fonts = fonts;
    }else{
      pack = JSON.parse(await file.text());
    }
    const err = validateCodex(pack);
    if(err){ toast(err); return; }
    delete pack.sample;
    omniTeardown();
    kvSet('codexEngine', null);
    state.codex = pack;
    state.lastLang = pack.languages[0].id;
    lastLangId = null;
    scheduleSave();
    await registerCodexFonts();
    await rerenderAllSpans();
    toast(`Codex loaded — ${pack.name || 'unnamed pack'}${pack.fonts ? ` · ${pack.fonts.length} fonts` : ''}`);
  }catch(e){
    toast('Couldn\u2019t read that pack');
  }
}
async function rerenderAllSpans(){
  // regenerate every span from stored source (deterministic, spec §3.5.5)
  const w = omniPack() ? await ensureOmni() : null;
  const redo = doc => {
    if(!doc || doc.indexOf('tspan') === -1) return doc;
    const tpl = document.createElement('template');
    tpl.innerHTML = doc;
    tpl.content.querySelectorAll('.tspan').forEach(el => {
      let fresh = null;
      if(w){
        const r = omniTranslate(w, el.dataset.lang, el.dataset.src);
        if(r) fresh = spanFromResult(r, el.dataset.src, null); // rom stored; decoration happens on open
      }else{
        try{ fresh = makeTSpan(el.dataset.lang, el.dataset.src); }catch(e){}
      }
      if(fresh) el.replaceWith(fresh);
    });
    const out = document.createElement('div');
    out.appendChild(tpl.content);
    return out.innerHTML;
  };
  state.books.forEach(b => {
    b.chapters.forEach(ch => ch.scenes.forEach(s => { s.doc = redo(s.doc); }));
    (b.cards || []).forEach(c => { c.notes = redo(c.notes); });
  });
  scheduleSave();
  if(currentSceneId){ const s = currentScene(); if(s){ edContent.innerHTML = s.doc || ''; decorateAll(edContent); } }
  if(navStack[navStack.length - 1] === 'card') renderCard();
}

/* ================= cards ================= */
/*
  The world-wiki. Cards are manual in this step (Claude harvesting is v1.5);
  linking is deterministic: a card's title + aliases are scanned across every
  scene to build the backlink graph, and across other cards' notes/keywords/
  quotes to find connected cards. Quotes are verbatim selections saved from
  the editor. Exports: story bible (.md), per-card .md, and a .zip archive
  of wikilink-compatible card files plus graph.json.
*/
const CARD_TYPES = [
  ['person', 'Person', 'People'],
  ['place', 'Place', 'Places'],
  ['thing', 'Thing', 'Things'],
  ['faction', 'Faction', 'Factions'],
  ['event', 'Event', 'Events'],
  ['language', 'Language', 'Languages'],
  ['artifact', 'Artifact', 'Artifacts']
];
const typeLabel = t => (CARD_TYPES.find(x => x[0] === t) || CARD_TYPES[0])[1];
const typePlural = t => (CARD_TYPES.find(x => x[0] === t) || CARD_TYPES[0])[2];
const typeIcon = t => ICONS['t_' + t] || ICONS.cards;

function newCard(title, type){
  return {
    id: uid(), type: type || 'person', title: title || '',
    aliases: [], keywords: [], quotes: [], notes: '',
    created: Date.now(), updated: Date.now()
  };
}
const cardById = (b, id) => (b.cards || []).find(c => c.id === id);
let currentCardId = null;
let cardsFilter = { q: '', type: 'all' };

/* -------- mention graph -------- */
const escapeRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function nameRegex(names){
  const alts = names.filter(n => n && n.trim().length >= 2).map(n => escapeRx(n.trim())).sort((a, b) => b.length - a.length);
  if(!alts.length) return null;
  const core = '(?:' + alts.join('|') + ')';
  try{ return new RegExp('(?<![\\p{L}\\p{N}])' + core + '(?![\\p{L}\\p{N}])', 'giu'); }
  catch(e){
    try{ return new RegExp('\\b' + core + '\\b', 'gi'); }
    catch(e2){ return null; }
  }
}
function countMatches(re, text){
  if(!re || !text) return 0;
  re.lastIndex = 0;
  let n = 0;
  while(re.exec(text)){ n++; if(n > 999) break; }
  return n;
}
function cardNames(c){ return [c.title, ...(c.aliases || [])]; }
function cardCorpus(c){
  return [plainOfHTML(c.notes || ''), (c.keywords || []).join(' '), (c.quotes || []).map(q => q.text).join(' ')].join(' ');
}
function buildMentions(b){
  const byCard = new Map(), byScene = new Map();
  const rows = [];
  b.chapters.forEach(ch => ch.scenes.forEach(s => rows.push({
    ch, s, text: (s.title ? s.title + ' ' : '') + plainOfHTML(s.doc)
  })));
  for(const c of (b.cards || [])){
    const re = nameRegex(cardNames(c));
    const hits = [];
    if(re){
      for(const row of rows){
        const n = countMatches(re, row.text);
        if(n){
          hits.push({ sceneId: row.s.id, chTitle: row.ch.title, scTitle: row.s.title, count: n });
          if(!byScene.has(row.s.id)) byScene.set(row.s.id, []);
          byScene.get(row.s.id).push({ cardId: c.id, count: n });
        }
      }
    }
    byCard.set(c.id, hits);
  }
  return { byCard, byScene };
}
function connectedCards(b, card){
  const out = [];
  const myRe = nameRegex(cardNames(card));
  const myCorpus = cardCorpus(card);
  for(const o of (b.cards || [])){
    if(o.id === card.id) continue;
    const oRe = nameRegex(cardNames(o));
    if((myRe && countMatches(myRe, cardCorpus(o))) || (oRe && countMatches(oRe, myCorpus))) out.push(o);
  }
  return out;
}

  $('#cd-filters').innerHTML = showFilters
    ? [['all', 'All'], ...typesPresent.map(([k, l]) => [k, l])].map(([k, l]) =>
        `<button class="fchip ${cardsFilter.type === k ? 'on' : ''}" data-ftype="${k}">${l}</button>`).join('')
    : '';

    if(!q) return true;
    return [c.title, ...(c.aliases || []), ...(c.keywords || []), plainOfHTML(c.notes || '')]
      .join(' ').toLowerCase().includes(q);
  };
  let html = '', shown = 0;
  for(const [k, , pl] of CARD_TYPES){
    const group = b.cards.filter(c => c.type === k && match(c))
      .sort((a, b2) => (a.title || '\uffff').localeCompare(b2.title || '\uffff'));
    if(!group.length) continue;
    shown += group.length;
    html += `<div class="cd-group">${pl}</div><div class="list">` + group.map(c => {
      const m = (idx.byCard.get(c.id) || []).reduce((n, h) => n + h.count, 0);
      const bits = [];
      if(m) bits.push(plural(m, 'mention'));
      if(c.aliases && c.aliases.length) bits.push(c.aliases.slice(0, 2).join(', '));
      if(!bits.length && c.keywords && c.keywords.length) bits.push(c.keywords.slice(0, 3).join(' · '));
      return `
      <button class="row" data-card="${c.id}">
        <span class="ci">${typeIcon(c.type)}</span>
        <span class="body">
          <span class="t ${c.title ? '' : 'untitled'}">${c.title ? esc(c.title) : 'Untitled card'}</span>

        <span class="aux"><span class="chev"><svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span></span>
      </button>`;
    }).join('') + `</div>`;
  }
  list.innerHTML = shown ? html : `<div class="sheet-note" style="padding:20px 18px;text-align:center">No cards match.</div>`;
  list.querySelectorAll('[data-card]').forEach(row =>
    row.addEventListener('click', () => openCard(row.dataset.card)));
}

function chipRow(el, arr, kind){

    `<span class="chipx">${esc(v)}<b data-x="${i}">×</b></span>`).join('') +
    `<button class="chipadd" data-add="1">+ ${kind}</button>`;

/* -------- cards export -------- */
function cardMD(b, c, mentions){
  const L = [`# ${c.title || 'Untitled card'}`, ''];
  let meta = `*${typeLabel(c.type)}*`;
  if(c.aliases && c.aliases.length) meta += ` — also: ${c.aliases.join(', ')}`;
  L.push(meta, '');
  if(c.keywords && c.keywords.length) L.push(`Keywords: ${c.keywords.join(' · ')}`, '');
  const notes = mdFromDoc(c.notes || '');
  if(notes) L.push(notes, '');
  if(c.quotes && c.quotes.length){
    L.push('## Quotes', '');
    for(const q of c.quotes){
      const f = findScene(b, q.sceneId);
      L.push('> ' + q.text.replace(/\n/g, '\n> '));
      if(f) L.push(`> — ${f.chapter.title} · ${f.scene.title || 'Untitled scene'}`);
      L.push('');
    }
  }
  if(mentions && mentions.length){
    L.push('## Mentioned in', '');
    mentions.forEach(m => L.push(`- ${m.chTitle} · ${m.scTitle || 'Untitled scene'}${m.count > 1 ? ` (×${m.count})` : ''}`));
    L.push('');
  }
  const conn = connectedCards(b, c);
  if(conn.length) L.push('## Connected', '', conn.map(o => `[[${o.title || 'Untitled card'}]]`).join(' · '), '');
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function storyBibleMD(b){
  const idx = buildMentions(b);
  let out = `# ${b.title} — Story Bible\n\n`;
  for(const [k, , pl] of CARD_TYPES){
    const group = (b.cards || []).filter(c => c.type === k)
      .sort((a, b2) => (a.title || '\uffff').localeCompare(b2.title || '\uffff'));
    if(!group.length) continue;
    out += `## ${pl}\n\n`;
    for(const c of group){
      out += cardMD(b, c, idx.byCard.get(c.id) || [])
        .replace(/^# /, '### ').replace(/^## /gm, '#### ') + '\n\n';
    }
  }
  return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
/* minimal ZIP writer — stored entries + CRC32, UTF-8 names */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(entries){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for(const e of entries){
    const nameB = enc.encode(e.name);
    const data = e.data instanceof Uint8Array ? e.data : enc.encode(e.data);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameB.length, true);
    parts.push(new Uint8Array(lh.buffer), nameB, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nameB.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  const out = new Uint8Array(offset + cdSize + 22);
  let p = 0;
  for(const part of [...parts, ...central, new Uint8Array(eo.buffer)]){ out.set(part, p); p += part.length; }
  return out;
}
function cardsGraphJSON(b){
  const idx = buildMentions(b);
  const edges = [];
  (b.cards || []).forEach(c => (idx.byCard.get(c.id) || []).forEach(m =>
    edges.push({ from: c.id, sceneId: m.sceneId, kind: 'mention', count: m.count })));
  (b.cards || []).forEach(c => connectedCards(b, c).forEach(o => {
    if(c.id < o.id) edges.push({ from: c.id, to: o.id, kind: 'card' });
  }));
  return JSON.stringify({
    app: 'tenebrae-writer', kind: 'cards-graph', book: b.title,
    exportedAt: new Date().toISOString(),
    cards: b.cards || [], edges
  }, null, 2);
}
function downloadCardsZip(b){
