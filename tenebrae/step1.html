/* ================= smart import ================= */
/*
  Every format funnels into one flat block stream:
    {k:'title'|'h'|'p'|'q'|'li'|'sep'|'chbreak', level?, html?, list?, soft?, title?}
  then structureFromBlocks() detects chapters/scenes:
    · chapter level = highest heading rank present (or explicit chapter breaks)
    · scenes split at asterism/asterisk/dash separator lines when present;
      otherwise at the next
      heading rank; otherwise at runs of blank lines (soft breaks)
    · a lone top heading becomes the book title
  The preview sheet shows what was detected and lets the writer flip the split rule.
*/
const SEP_TEXT = /^\s*(?:⁂[⁂\s]*|#|(?:[*#•·~_=—–-][ \t]*){3,})\s*$/;

function isChapterHeadingLine(line){
  const t = String(line || '').trim();
  if(!t || t.length > 64) return false;
  if(/^(prologue|epilogue|interlude|foreword|afterword)\b[\s.:!—–-]*$/i.test(t)) return true;
  return /^(chapter|part|act|book)\s+([0-9]{1,4}|[ivxlcdm]{1,7}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty(?:[-\s]\w+)?|thirty(?:[-\s]\w+)?|forty(?:[-\s]\w+)?|fifty(?:[-\s]\w+)?)\b[\s.:—–-]*(.{0,40})$/i.test(t);
}

function plainOfHTML(html){
  const t = document.createElement('template');
  t.innerHTML = String(html || '');
  // textContent has no block separators — 'KaelHe' at a block junction would
  // hide a mention from the word-boundary scan
  t.content.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,blockquote,ul,ol,li,br').forEach(b => {
    b.before(document.createTextNode(' '));
    b.after(document.createTextNode(' '));
  });
  return (t.content.textContent || '').trim();
}
function htmlWords(html){
  const t = document.createElement('template');
  t.innerHTML = String(html || '');
  return countWords(textOf(t.content));
}
function runsHTML(runs){
  return runs.map(r => {
    let h = esc(r.text);
    if(r.sc) h = `<span class="sc">${h}</span>`;
    if(r.s) h = `<s>${h}</s>`;
    if(r.u) h = `<u>${h}</u>`;
    if(r.i) h = `<i>${h}</i>`;
    if(r.b) h = `<b>${h}</b>`;
    return h;
  }).join('');
}
function inlineMD(text){
  const stash = [];
  let src = String(text).replace(/<!--tenebrae:begin\s+({.*?})-->.*?<!--tenebrae:end-->/g, (all, meta) => {
    try{
      const m = JSON.parse(meta.replace(/\\u002d/g, '-'));
      if(m && m.source){ stash.push({ lang: m.language, src: m.source }); return `\u0000TN${stash.length - 1}\u0000`; }
    }catch(e){}
    return all;
  });
  // backslash-escaped punctuation is literal text — shield it from the mark
  // regexes, then restore it, so the app's own exports round-trip faithfully
  const lits = [];
  src = src.replace(/\\([\\`*_~\[\]<>#+.\-])/g, (_, c) => { lits.push(c); return `\u0000LT${lits.length - 1}\u0000`; });
  let h = esc(src);
  h = h.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/__([^_\n]+)__/g, '<b>$1</b>');
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?…]|$)/g, '$1<i>$2</i>');
  h = h.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?…]|$)/g, '$1<i>$2</i>');
  h = h.replace(/`([^`\n]+)`/g, '$1');
  h = h.replace(/\u0000LT(\d+)\u0000/g, (_, i) => esc(lits[+i]));
  h = h.replace(/\u0000TN(\d+)\u0000/g, (_, i) => {
    const t = stash[+i];
    return t ? tspanHTML(t.lang, t.src) : '';
  });
  return h;
}

/* -------- markdown / plain text -------- */
function textishBlocks(raw){
  let text = String(raw).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  if(/^---\n/.test(text)){ // YAML front matter
    const end = text.indexOf('\n---', 3);
    if(end > -1 && end < 4000){
      const nl = text.indexOf('\n', end + 1);
      if(nl > -1) text = text.slice(nl + 1);
    }
  }
  const lines = text.split('\n');
  const isMD = /^#{1,6}\s+\S/m.test(text);
  const hasSepLines = lines.some(l => SEP_TEXT.test(l) && l.trim() !== '');
  const indentStarts = lines.filter(l => /^(\t| {3,})\S/.test(l)).length;
  const blankCount = lines.filter(l => !l.trim()).length;
  const indentMode = indentStarts >= 6 && indentStarts > blankCount;

  const blocks = [];
  let paraBuf = [], qBuf = [], blankRun = 0, prevBlank = true, softInjected = 0;
  const flushP = () => { if(paraBuf.length){ blocks.push({ k: 'p', html: inlineMD(paraBuf.join(' ')) }); paraBuf = []; } };
  const flushQ = () => { if(qBuf.length){ blocks.push({ k: 'q', html: inlineMD(qBuf.join(' ')) }); qBuf = []; } };

  for(const rawLine of lines){
    const line = rawLine.replace(/\s+$/, '');
    const t = line.trim();
    if(!t){
      flushP(); flushQ();
      blankRun++;
      if(blankRun === 2 && !hasSepLines && !indentMode && blocks.length){
        blocks.push({ k: 'sep', soft: true }); softInjected++;
      }
      prevBlank = true;
      continue;
    }
    blankRun = 0;
    if(SEP_TEXT.test(t)){ flushP(); flushQ(); blocks.push({ k: 'sep' }); prevBlank = true; continue; }
    const hm = t.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ flushP(); flushQ(); blocks.push({ k: 'h', level: hm[1].length, html: inlineMD(hm[2].trim()) }); prevBlank = false; continue; }
    const qm = t.match(/^>\s?(.*)$/);
    if(qm){ flushP(); if(qm[1].trim()) qBuf.push(qm[1].trim()); prevBlank = false; continue; }
    const um = t.match(/^[-*+]\s+(.+)$/);
    if(um){ flushP(); flushQ(); blocks.push({ k: 'li', list: 'ul', html: inlineMD(um[1].trim()) }); prevBlank = false; continue; }
    const om = t.match(/^\d{1,3}[.)]\s+(.+)$/);
    if(om){ flushP(); flushQ(); blocks.push({ k: 'li', list: 'ol', html: inlineMD(om[1].trim()) }); prevBlank = false; continue; }
    if(!isMD && prevBlank && isChapterHeadingLine(t)){
      flushP(); flushQ(); blocks.push({ k: 'h', level: 1, html: esc(t) }); prevBlank = false; continue;
    }
    flushQ();
    if(indentMode){ flushP(); blocks.push({ k: 'p', html: inlineMD(t) }); }
    else paraBuf.push(t);
    prevBlank = false;
  }
  flushP(); flushQ();
  return { blocks, meta: { soft: softInjected > 0 } };
}

/* -------- HTML -------- */
function inlineFromNode(node){
  let out = '';
  node.childNodes.forEach(c => {
    if(c.nodeType === 3){ out += esc(c.nodeValue); return; }
    if(c.nodeType !== 1) return;
    const tag = c.tagName;
    if(tag === 'BR'){ out += ' '; return; }
    if(tag === 'SPAN' && c.classList.contains('tspan') && c.dataset && c.dataset.src){
      out += tspanHTML(c.dataset.lang, c.dataset.src);
      return;
    }
    const inner = inlineFromNode(c);
    if(tag === 'B' || tag === 'STRONG') out += `<b>${inner}</b>`;
    else if(tag === 'I' || tag === 'EM') out += `<i>${inner}</i>`;
    else if(tag === 'U') out += `<u>${inner}</u>`;
    else if(tag === 'S' || tag === 'DEL' || tag === 'STRIKE') out += `<s>${inner}</s>`;
    else if(tag === 'SPAN' && (c.classList.contains('sc') || /small-caps/.test(c.getAttribute('style') || ''))) out += `<span class="sc">${inner}</span>`;
    else if(tag === 'P' || tag === 'DIV' || tag === 'LI') out += inner + ' ';
    else out += inner;
  });
  return out;
}
function htmlBlocksFromBody(rootEl, blocks, headingShift){
  const shift = headingShift || 0;
  const walk = el => {
    for(const c of Array.from(el.children)){
      const tag = c.tagName;
      const hm = tag.match(/^H([1-6])$/);
      if(hm){
        const txt = inlineFromNode(c).trim();
        if(plainOfHTML(txt)) blocks.push({ k: 'h', level: Math.min(6, +hm[1] + shift), html: txt });
        continue;
      }
      if(tag === 'HR' || (tag === 'DIV' && c.classList.contains('asterism'))){ blocks.push({ k: 'sep' }); continue; }
      if(tag === 'P' || tag === 'FIGCAPTION'){
        const plain = (c.textContent || '').trim();
        if(!plain) continue;
        if(SEP_TEXT.test(plain)){ blocks.push({ k: 'sep' }); continue; }
        blocks.push({ k: 'p', html: inlineFromNode(c).trim() });
        continue;
      }
      if(tag === 'BLOCKQUOTE'){
        const q = inlineFromNode(c).trim();
        if(plainOfHTML(q)) blocks.push({ k: 'q', html: q });
        continue;
      }
      if(tag === 'UL' || tag === 'OL'){
        const list = tag === 'UL' ? 'ul' : 'ol';
        for(const li of Array.from(c.children)){
          if(li.tagName !== 'LI') continue;
          const h = inlineFromNode(li).trim();
          if(plainOfHTML(h)) blocks.push({ k: 'li', list, html: h });
        }
        continue;
      }
      if(tag === 'DIV' || tag === 'SECTION' || tag === 'ARTICLE' || tag === 'MAIN' || tag === 'HEADER' || tag === 'FOOTER'){
        const plain = (c.textContent || '').trim();
        if(!plain) continue;
        if(SEP_TEXT.test(plain)){ blocks.push({ k: 'sep' }); continue; }
        if(c.children.length){ walk(c); }
        else blocks.push({ k: 'p', html: inlineFromNode(c).trim() });
        continue;
      }
      // ignore scripts, styles, tables, figures, imgs, nav…
    }
  };
  walk(rootEl);
  return blocks;
}
function htmlToBlocks(text){
  const doc = new DOMParser().parseFromString(String(text), 'text/html');
  const blocks = [];
  htmlBlocksFromBody(doc.body, blocks, 0);
  const docTitle = (doc.title || '').trim();
  return { blocks, meta: { docTitle } };
}

/* -------- zip (docx / epub) -------- */
async function unzipAll(buf){
  const dv = new DataView(buf);
  let eocd = -1;
  const min = Math.max(0, buf.byteLength - 65558);
  for(let i = buf.byteLength - 22; i >= min; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('not a zip');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = [];
  const td = new TextDecoder();
  for(let n = 0; n < count; n++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = td.decode(new Uint8Array(buf, off + 46, nameLen));
    entries.push({ name, method, csize, lho });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  const files = new Map();
  for(const e of entries){
    if(e.name.endsWith('/')) continue;
    const nl = dv.getUint16(e.lho + 26, true), xl = dv.getUint16(e.lho + 28, true);
    const start = e.lho + 30 + nl + xl;
    const slice = buf.slice(start, start + e.csize);
    if(e.method === 0) files.set(e.name, new Uint8Array(slice));
    else if(e.method === 8){
      const ds = new DecompressionStream('deflate-raw');
      const ab = await new Response(new Blob([slice]).stream().pipeThrough(ds)).arrayBuffer();
      files.set(e.name, new Uint8Array(ab));
    }
  }
  return files;
}

/* -------- DOCX -------- */
function docxToBlocks(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const all = (root, name) => Array.from(root.getElementsByTagNameNS('*', name));
  const one = (el, name) => (el ? el.getElementsByTagNameNS('*', name)[0] || null : null);
  const wval = el => {
    if(!el) return null;
    for(const a of Array.from(el.attributes)) if(a.localName === 'val') return a.value;
    return null;
  };
  const body = one(doc, 'body') || doc.documentElement;
  const paras = all(body, 'p');
  const styleOf = p => (wval(one(one(p, 'pPr'), 'pStyle')) || '').toLowerCase();
  const docHasHeadings = paras.some(p => /^(?:heading|h|überschrift|titre|t[ií]tulo|rubrik|nadpis)[\s_-]*[1-6]$/.test(styleOf(p)));
  const blocks = [];
  for(const p of paras){
    const sv = styleOf(p);
    const pPr = one(p, 'pPr');
    const isList = !!one(pPr, 'numPr');
    const runs = [];
    for(const r of all(p, 'r')){
      const rPr = one(r, 'rPr');
      const flag = tag => {
        const el = one(rPr, tag);
        if(!el) return false;
        const v = wval(el);
        return !(v === '0' || v === 'false' || v === 'none');
      };
      let txt = '';
      for(const c of Array.from(r.childNodes)){
        if(c.nodeType !== 1) continue;
        if(c.localName === 't') txt += c.textContent;
        else if(c.localName === 'br' || c.localName === 'tab' || c.localName === 'cr') txt += ' ';
      }
      if(!txt) continue;
      runs.push({
        text: txt,
        b: flag('b'), i: flag('i'),
        u: !!one(rPr, 'u') && wval(one(rPr, 'u')) !== 'none',
        s: flag('strike'),
        sc: flag('smallCaps') || flag('caps')
      });
    }
    const plain = runs.map(r => r.text).join('').trim();
    if(!plain) continue;
    if(SEP_TEXT.test(plain)){ blocks.push({ k: 'sep' }); continue; }
    if(sv === 'title'){ blocks.push({ k: 'title', html: runsHTML(runs) }); continue; }
    const hm = sv.match(/^(?:heading|h|überschrift|titre|t[ií]tulo|rubrik|nadpis)[\s_-]*([1-6])$/);
    if(hm){ blocks.push({ k: 'h', level: +hm[1], html: runsHTML(runs) }); continue; }
    if(/quote|citation/.test(sv)){ blocks.push({ k: 'q', html: runsHTML(runs) }); continue; }
    if(isList){ blocks.push({ k: 'li', list: /number/.test(sv) ? 'ol' : 'ul', html: runsHTML(runs) }); continue; }
    if(!docHasHeadings && isChapterHeadingLine(plain)){ blocks.push({ k: 'h', level: 1, html: esc(plain) }); continue; }
    blocks.push({ k: 'p', html: runsHTML(runs) });
  }
  return { blocks, meta: {} };
}

/* -------- RTF -------- */
const RTF_SKIP = new Set(['fonttbl','colortbl','stylesheet','info','pict','object','themedata','colorschememapping','latentstyles','listtable','listoverridetable','rsidtbl','generator','xmlnstbl','datastore','ffdefres','wgrffmtfilter','pnseclvl','pntext','filetbl','revtbl','fchars','lchars','panose','operator','author','company','title2']);
const CP1252 = { 0x82:'‚',0x84:'„',0x85:'…',0x91:'‘',0x92:'’',0x93:'“',0x94:'”',0x95:'•',0x96:'–',0x97:'—',0x99:'™' };
function rtfToBlocks(raw){
  raw = String(raw);
  const blocks = [];
  const st = { b:0, i:0, u:0, s:0, sc:0, skip:0, uc:1 };
  const stack = [];
  let runs = [], text = '', i = 0;
  const n = raw.length;
  const flushText = () => {
    if(text){
      if(!st.skip) runs.push({ text, b:!!st.b, i:!!st.i, u:!!st.u, s:!!st.s, sc:!!st.sc });
      text = '';
    }
  };
  const endPara = () => {
    flushText();
    const plain = runs.map(r => r.text).join('').trim();
    if(plain){
      if(SEP_TEXT.test(plain)) blocks.push({ k: 'sep' });
      else if(isChapterHeadingLine(plain)) blocks.push({ k: 'h', level: 1, html: esc(plain) });
      else blocks.push({ k: 'p', html: runsHTML(runs) });
    }
    runs = [];
  };
  while(i < n){
    const c = raw[i];
    if(c === '{'){ flushText(); stack.push({ ...st }); i++; continue; }
    if(c === '}'){ flushText(); const prev = stack.pop(); if(prev) Object.assign(st, prev); i++; continue; }
    if(c === '\\'){
      const next = raw[i + 1];
      if(next === "'"){ // hex escape
        const code = parseInt(raw.substr(i + 2, 2), 16);
        if(!st.skip && !isNaN(code)) text += CP1252[code] || String.fromCharCode(code);
        i += 4; continue;
      }
      if(next === '\\' || next === '{' || next === '}'){ if(!st.skip) text += next; i += 2; continue; }
      if(next === '~'){ if(!st.skip) text += '\u00A0'; i += 2; continue; }
      if(next === '-'){ i += 2; continue; }
      if(next === '_'){ if(!st.skip) text += '-'; i += 2; continue; }
      if(next === '*'){ st.skip = 1; i += 2; continue; }
      const m = /^\\([a-z]{1,32})(-?\d{1,10})? ?/i.exec(raw.slice(i, i + 44));
      if(!m){ i++; continue; }
      const w = m[1].toLowerCase();
      const num = m[2] !== undefined ? parseInt(m[2], 10) : null;
      i += m[0].length;
      if(RTF_SKIP.has(w)){ st.skip = 1; continue; }
      if(st.skip && w !== 'u') continue;
      switch(w){
        case 'par': case 'sect': case 'page': endPara(); break;
        case 'line': case 'tab': case 'emspace': case 'enspace': text += ' '; break;
        case 'emdash': text += '—'; break;
        case 'endash': text += '–'; break;
        case 'lquote': text += '‘'; break;
        case 'rquote': text += '’'; break;
        case 'ldblquote': text += '“'; break;
        case 'rdblquote': text += '”'; break;
        case 'bullet': text += '•'; break;
        case 'b': flushText(); st.b = num === 0 ? 0 : 1; break;
        case 'i': flushText(); st.i = num === 0 ? 0 : 1; break;
        case 'ul': flushText(); st.u = num === 0 ? 0 : 1; break;
        case 'ulnone': flushText(); st.u = 0; break;
        case 'strike': flushText(); st.s = num === 0 ? 0 : 1; break;
        case 'scaps': case 'caps': flushText(); st.sc = num === 0 ? 0 : 1; break;
        case 'plain': flushText(); st.b = st.i = st.u = st.s = st.sc = 0; break;
        case 'uc': st.uc = num == null ? 1 : num; break;
        case 'u': {
          let code = num == null ? 0 : num;
          if(code < 0) code += 65536;
          if(!st.skip && code) text += String.fromCharCode(code);
          let skipN = st.uc;
          while(skipN-- > 0 && i < n){
            if(raw[i] === '\\' && raw[i + 1] === "'") i += 4;
            else if(raw[i] === '\\'){ const mm = /^\\[a-z]{1,32}(-?\d{1,10})? ?/i.exec(raw.slice(i, i + 44)); i += mm ? mm[0].length : 1; }
            else i++;
          }
          break;
        }
      }
      continue;
    }
    if(c === '\n' || c === '\r'){ i++; continue; }
    if(!st.skip) text += c;
    i++;
  }
  endPara();
  return { blocks, meta: {} };
}

/* -------- EPUB -------- */
function pathJoin(baseDir, href){
  href = decodeURIComponent(String(href).split('#')[0]);
  const parts = (baseDir ? baseDir.split('/') : []).concat(href.split('/'));
  const out = [];
  for(const p of parts){
    if(!p || p === '.') continue;
    if(p === '..') out.pop();
    else out.push(p);
  }
  return out.join('/');
}
function epubToBlocks(files){
  const td = new TextDecoder();
  const read = name => { const f = files.get(name); return f ? td.decode(f) : null; };
  const contXml = read('META-INF/container.xml');
  if(!contXml) throw new Error('epub: no container');
  const cont = new DOMParser().parseFromString(contXml, 'application/xml');
  const rootfile = cont.getElementsByTagNameNS('*', 'rootfile')[0];
  const opfPath = rootfile && rootfile.getAttribute('full-path');
  if(!opfPath) throw new Error('epub: no rootfile');
  const opfXml = read(opfPath);
  const opf = new DOMParser().parseFromString(opfXml, 'application/xml');
  const baseDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')) : '';
  const items = {};
  for(const it of Array.from(opf.getElementsByTagNameNS('*', 'item'))){
    items[it.getAttribute('id')] = {
      href: it.getAttribute('href'),
      type: it.getAttribute('media-type') || '',
      props: it.getAttribute('properties') || ''
    };
  }
  const titleEl = opf.getElementsByTagNameNS('*', 'title')[0];
  const bookTitle = titleEl ? titleEl.textContent.trim() : '';
  const blocks = [];
  let chN = 0;
  for(const ref of Array.from(opf.getElementsByTagNameNS('*', 'itemref'))){
    const item = items[ref.getAttribute('idref')];
    if(!item || !/html/.test(item.type) || /nav/.test(item.props)) continue;
    const html = read(pathJoin(baseDir, item.href));
    if(!html) continue;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const wordsHere = countWords(doc.body ? doc.body.textContent : '');
    const head = doc.body && doc.body.querySelector('h1,h2,h3');
    const chTitle = head ? head.textContent.trim() : '';
    if(wordsHere < 12 && !chTitle) continue; // cover / colophon pages
    chN++;
    blocks.push({ k: 'chbreak', title: chTitle || `Chapter ${chN}` });
    const before = blocks.length;
    htmlBlocksFromBody(doc.body, blocks, 0);
    if(head){ // drop the heading we consumed as the chapter title
      for(let x = before; x < blocks.length; x++){
        if(blocks[x].k === 'h' && plainOfHTML(blocks[x].html) === chTitle){ blocks.splice(x, 1); break; }
      }
    }
  }
  return { blocks, meta: { docTitle: bookTitle } };
}

/* -------- structure detection -------- */
function structureFromBlocks(rawBlocks, opts, fallbackTitle){
  let blocks = rawBlocks.filter(Boolean);
  const hasChbreak = blocks.some(b => b.k === 'chbreak');
  let title = null;
  const ti = blocks.findIndex(b => b.k === 'title');
  if(ti > -1){ title = plainOfHTML(blocks[ti].html); blocks = blocks.filter((_, x) => x !== ti); }
  let levels = [...new Set(blocks.filter(b => b.k === 'h').map(b => b.level))].sort((a, b) => a - b);
  let chapterLevel = null, sceneLevel = null;
  if(!hasChbreak){
    if(title == null && levels.length){
      const L = levels[0];
      const heads = blocks.filter(b => b.k === 'h' && b.level === L);
      const firstHeadIdx = blocks.indexOf(heads[0]);
      const firstBodyIdx = blocks.findIndex(b => b.k === 'p' || b.k === 'q' || b.k === 'li');
      if(heads.length === 1 && (firstBodyIdx === -1 || firstHeadIdx < firstBodyIdx)){
        title = plainOfHTML(heads[0].html);
        blocks = blocks.filter(b => b !== heads[0]);
        levels = levels.slice(1);
      }
    }
    chapterLevel = levels.length ? levels[0] : null;
    sceneLevel = levels.length > 1 ? levels[1] : null;
  }else{
    sceneLevel = levels.length ? levels[0] : null;
  }
  const hardSep = blocks.some(b => b.k === 'sep' && !b.soft);
  const softSep = blocks.some(b => b.k === 'sep' && b.soft);
  let mode = (opts && opts.sceneMode) || 'auto';
  if(mode === 'auto') mode = hardSep ? 'sep' : (sceneLevel != null ? 'h' : (softSep ? 'sep' : 'none'));

  const chapters = [];
  let ch = null, sc = null;
  const openCh = t => { ch = { title: t || '', scenes: [] }; chapters.push(ch); sc = null; };
  const openSc = t => { if(!ch) openCh(''); sc = { title: t || '', blocks: [] }; ch.scenes.push(sc); };
  const put = b => { if(!sc) openSc(''); sc.blocks.push(b); };

  for(const b of blocks){
    if(b.k === 'chbreak'){ openCh(b.title); continue; }
    if(b.k === 'h'){
      if(!hasChbreak && b.level === chapterLevel){ openCh(plainOfHTML(b.html)); continue; }
      if(sceneLevel != null && b.level === sceneLevel && mode === 'h'){ openSc(plainOfHTML(b.html)); continue; }
      const base = (sceneLevel != null && mode === 'h') ? sceneLevel
        : (sceneLevel != null ? sceneLevel - 1 : (chapterLevel != null ? chapterLevel : 0));
      put({ k: b.level <= base + 1 ? 'h2' : 'h3', html: b.html });
      continue;
    }
    if(b.k === 'sep'){
      if(mode === 'sep'){ if(sc && sc.blocks.length) openSc(''); }
      else if(!b.soft) put({ k: 'ast' });
      continue;
    }
    put(b);
  }

  const out = [];
  chapters.forEach(c => {
    const scenes = [];
    c.scenes.forEach(s => {
      const doc = blocksToDoc(s.blocks);
      if(!doc && !s.title) return;
      scenes.push({ title: s.title, doc, words: htmlWords(doc) });
    });
    if(!scenes.length){
      if(!c.title) return;
      scenes.push({ title: '', doc: '', words: 0 });
    }
    out.push({ title: c.title, scenes });
  });
  if(!out.length) out.push({ title: 'Chapter 1', scenes: [{ title: '', doc: '', words: 0 }] });
  out.forEach((c, idx) => {
    if(!c.title) c.title = (idx === 0 && out.length > 1) ? 'Opening' : `Chapter ${idx + 1}`;
  });
  return {
    title: (title || fallbackTitle || 'Imported Manuscript').trim(),
    chapters: out,
    meta: { mode, hardSep, softSep, sceneLevel, chapterLevel, hasChbreak }
  };
}
function blocksToDoc(blocks){
  let html = '', listBuf = null, listType = null;
  const flushList = () => {
    if(listBuf && listBuf.length){
      html += `<${listType}>` + listBuf.map(li => `<li>${li}</li>`).join('') + `</${listType}>`;
    }
    listBuf = null; listType = null;
  };
  for(const b of blocks){
    if(b.k === 'li'){
      if(listType !== b.list){ flushList(); listType = b.list; listBuf = []; }
      listBuf.push(b.html); continue;
    }
    flushList();
    if(b.k === 'p') html += `<p>${b.html}</p>`;
    else if(b.k === 'h2') html += `<h2>${b.html}</h2>`;
    else if(b.k === 'h3') html += `<h3>${b.html}</h3>`;
    else if(b.k === 'q') html += `<blockquote>${b.html}</blockquote>`;
    else if(b.k === 'ast') html += `<div class="asterism" contenteditable="false">⁂</div>`;
  }
  flushList();
  return html;
}

/* -------- import flow -------- */
let importCtx = null;

function titleFromFilename(name){
  return String(name || '').replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim() || 'Imported Manuscript';
}

async function routeImport(file){
  const name = file.name || 'manuscript';
  const ext = (name.split('.').pop() || '').toLowerCase();
  if(file.size && file.size > 40 * 1024 * 1024){ toast('That file is too large to import'); return; }
  if(ext === 'json'){ offerRestore(await file.text()); return; }
  if(ext === 'doc'){ toast('Old .doc files aren’t supported — save as .docx or .rtf first'); return; }
  let parsed, kindLabel;
  if(ext === 'docx' || ext === 'epub'){
    if(typeof DecompressionStream === 'undefined'){
      toast('Word & EPUB import needs iOS 16.4+ — export as Markdown or RTF instead');
      return;
    }
    const files = await unzipAll(await file.arrayBuffer());
    if(ext === 'docx'){
      const xml = files.get('word/document.xml');
      if(!xml) throw new Error('no document.xml');
      parsed = docxToBlocks(new TextDecoder().decode(xml));
      kindLabel = 'Word document';
    }else{
      parsed = epubToBlocks(files);
      kindLabel = 'EPUB';
    }
  }else if(ext === 'rtf'){
    parsed = rtfToBlocks(await file.text());
    kindLabel = 'Rich text';
  }else if(ext === 'html' || ext === 'htm'){
    parsed = htmlToBlocks(await file.text());
    kindLabel = 'HTML';
  }else{
    parsed = textishBlocks(await file.text());
    kindLabel = (ext === 'md' || ext === 'markdown') ? 'Markdown' : 'Plain text';
  }
  if(!parsed.blocks.some(b => b.k === 'p' || b.k === 'q' || b.k === 'li' || b.k === 'h' || b.k === 'title')){
    toast('Nothing readable found in that file');
    return;
  }
  importCtx = {
    blocks: parsed.blocks,
    fallbackTitle: (parsed.meta && parsed.meta.docTitle) || titleFromFilename(name),
    filename: name, kindLabel,
    opts: { sceneMode: 'auto' },
    titleOverride: null
  };
  importPreview();
}

function importPreview(){
  const ctx = importCtx; if(!ctx) return;
  const model = structureFromBlocks(ctx.blocks, ctx.opts, ctx.fallbackTitle);
  const chN = model.chapters.length;
  const scN = model.chapters.reduce((n, c) => n + c.scenes.length, 0);
  const w = model.chapters.reduce((n, c) => n + c.scenes.reduce((m, s) => m + s.words, 0), 0);

  const canSep = model.meta.hardSep || model.meta.softSep;
  const canH = model.meta.sceneLevel != null;
  const segNeeded = (canSep ? 1 : 0) + (canH ? 1 : 0) >= 1 && (canSep || canH);
  const sepLabel = model.meta.hardSep ? '⁂ Separators' : 'Blank gaps';
  const segHTML = segNeeded ? `
    <div class="seg-lbl">Split scenes at</div>
    <div class="seg" id="imp-seg">
      ${canSep ? `<button data-mode="sep" class="${model.meta.mode === 'sep' ? 'on' : ''}">${sepLabel}</button>` : ''}
      ${canH ? `<button data-mode="h" class="${model.meta.mode === 'h' ? 'on' : ''}">Headings</button>` : ''}
      <button data-mode="none" class="${model.meta.mode === 'none' ? 'on' : ''}">Don’t split</button>
    </div>` : '';

  const rows = model.chapters.slice(0, 10).map(c => {
    const cw = c.scenes.reduce((m, s) => m + s.words, 0);
    return `<div class="tr"><span class="tt">${esc(c.title)}</span><span class="tc">${plural(c.scenes.length, 'scene')} · ${fmt(cw)} w</span></div>`;
  }).join('') + (chN > 10 ? `<div class="tr more"><span class="tt">+ ${chN - 10} more chapters</span></div>` : '');

  openSheetHTML(`
    <div class="sheet-title">Import Manuscript</div>
    <div class="imp-src">${esc(ctx.filename)} · ${esc(ctx.kindLabel)}</div>
    <input class="sheet-input" id="imp-title" placeholder="Book title" autocapitalize="words"
      value="${esc(ctx.titleOverride != null ? ctx.titleOverride : model.title)}">
    <div class="imp-stats">${plural(chN, 'chapter')} · ${plural(scN, 'scene')} · ${fmt(w)} words</div>
    ${segHTML}
    <div class="imp-tree">${rows}</div>
    <div class="sheet-actions">
      <button id="imp-cancel">Cancel</button>
      <button id="imp-go" class="primary">Import</button>
    </div>`);

  const titleInput = $('#imp-title');
  titleInput.addEventListener('input', () => { ctx.titleOverride = titleInput.value; });
  const seg = $('#imp-seg');
  if(seg) seg.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    ctx.opts.sceneMode = btn.dataset.mode;
    importPreview();
  }));
  $('#imp-cancel').addEventListener('click', () => { importCtx = null; closeSheet(); });
  $('#imp-go').addEventListener('click', () => {
    closeSheet();
    setTimeout(() => commitImport(model), 120);
  });
}

function commitImport(model){
  const ctx = importCtx; importCtx = null;
  const chosen = ctx && ctx.titleOverride != null ? ctx.titleOverride.trim() : '';
  const b = newBook(chosen || model.title);
  for(const c of model.chapters){
    const ch = newChapter(c.title);
    for(const s of c.scenes){
      const sc = newScene(s.title);
      sc.doc = sanitizeHTML(s.doc);
      sc.words = htmlWords(sc.doc);
      ch.scenes.push(sc);
    }
    b.chapters.push(ch);
  }
  state.books.push(b);
  scheduleSave();
  renderLibrary();
  openBook(b.id);
  const scN = model.chapters.reduce((n, c) => n + c.scenes.length, 0);
  toast(`Imported ${plural(model.chapters.length, 'chapter')} · ${plural(scN, 'scene')}`);
}

$('#import-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{ await routeImport(file); }
  catch(err){ toast('Couldn’t read that file'); }
});

/* ================= backup / restore ================= */
async function backupAll(){
  flushSave();
  const payload = { app: 'tenebrae-writer', version: state.version, exportedAt: new Date().toISOString(), state };
  // the engine HTML lives under its own kv key — without it a backup cannot
  // revive an imported codex on a fresh device
  if(omniPack()){
    const engine = window.__codexEngineHTML || await kvGet('codexEngine');
    if(engine) payload.codexEngine = engine;
  }
  const stamp = new Date().toISOString().slice(0, 10);
  download(`tenebrae-backup-${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json');
}
function offerRestore(text){
  try{
    const data = JSON.parse(text);
    const st = data && data.app === 'tenebrae-writer' && data.state ? data.state : null;
    if(!st || !Array.isArray(st.books)) throw new Error('bad shape');
    confirmSheet('Restore this backup?', `${plural(st.books.length, 'book')} — replaces everything currently here.`, 'Restore', () => {
      state = st;
      state.codex = state.codex || null;
      // omni-host packs carry no languages[] — same exemption as the boot guard
      if(state.codex && state.codex.kind !== 'omni-host' && validateCodex(state.codex)) state.codex = null;
      if(data.codexEngine && state.codex && state.codex.kind === 'omni-host'){
        omniTeardown();
        window.__codexEngineHTML = data.codexEngine;
        kvSet('codexEngine', data.codexEngine);
      }
      lastLangId = null;
      flushSave();
      registerCodexFonts();
      state.tsv = 2;
      rerenderAllSpans();
      navStack = ['library']; applyNav();
      renderLibrary();
      toast('Backup restored');
    });
  }catch(err){ toast('That file isn’t a Tenebrae backup'); }
}
$('#restore-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{ offerRestore(await file.text()); }
  catch(err){ toast('Couldn’t read that file'); }
});

function showCtx(x, y, items){

  el.innerHTML = items.map((it, i) =>
    `<button class="ctx-i" data-i="${i}">${it.icon || ''}<span>${esc(it.label)}</span>${it.k ? `<span class="k">${it.k}</span>` : ''}</button>`
  ).join('');
  el.addEventListener('mousedown', ev => ev.preventDefault()); // keep the selection alive
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  const app = $('#app').getBoundingClientRect();
  el.style.left = Math.min(Math.max(x, app.left + 8), Math.max(app.left + 8, app.right - r.width - 8)) + 'px';
  el.style.top = Math.min(Math.max(y, 8), Math.max(8, window.innerHeight - r.height - 8)) + 'px';
  el.querySelectorAll('.ctx-i').forEach(b => b.addEventListener('click', () => {
    const it = items[+b.dataset.i];
    closeCtx();
    if(it.onTap) it.onTap();
  }));
  ctxEl = el;
}
document.addEventListener('mousedown', e => { if(ctxEl && !ctxEl.contains(e.target)) closeCtx(); }, true);
window.addEventListener('resize', closeCtx);
document.addEventListener('scroll', closeCtx, true);

edContent.addEventListener('contextmenu', e => {
  const tsp = e.target.closest && e.target.closest('.tspan');
  if(tsp){
    e.preventDefault();
    persistEditor();
    tspanSheet(tsp);
    return;
  }
  let selText = '';
  try{
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed && sel.anchorNode && edContent.contains(sel.anchorNode)){
      edSelRange = sel.getRangeAt(0).cloneRange();
      selText = selTextFromRange(edSelRange);
    }
  }catch(err){}
  if(!selText) return; // no selection → native menu (paste, spellcheck)
  e.preventDefault();
  const short = selText.length > 22 ? selText.slice(0, 21) + '…' : selText;
  showCtx(e.clientX, e.clientY, [
    { label: `Translate “${short}”…`, icon: ICONS.rune, onTap: () => translateSheet(selText, currentSceneId) },
    { label: 'Save to a card…', icon: ICONS.quote, onTap: () => quoteToCardSheet(selText, currentSceneId) },
    { label: 'Copy', icon: ICONS.copy, k: MOD_LABEL === '⌘' ? '⌘C' : 'Ctrl+C', onTap: () => { try{ document.execCommand('copy'); }catch(err){} } }
  ]);
});

/* keyboard */
const MOD_LABEL = /Mac|iP(hone|ad|od)/.test(navigator.platform || '') ? '⌘' : 'Ctrl';
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if(mod && !e.altKey && (e.key === 's' || e.key === 'S') && !e.shiftKey){
    e.preventDefault();
    persistEditor(); persistCard(); flushSave();
    toast('Saved');
    return;
  }
  if(mod && !e.altKey){
    const a = document.activeElement;
    const inEditor = a === edContent || edContent.contains(a);
    const inNotes = a === ccNotes || ccNotes.contains(a);
    if(inEditor || inNotes){
      const key = e.key.toLowerCase();
      let cmd = null;
      if(!e.shiftKey && key === 'b') cmd = 'bold';
      else if(!e.shiftKey && key === 'i') cmd = 'italic';
      else if(!e.shiftKey && key === 'u') cmd = 'underline';
      else if(e.shiftKey && key === 'x') cmd = 'strikeThrough';
      if(cmd){
        e.preventDefault();
        try{ document.execCommand(cmd); }catch(err){}
        if(inEditor){ refreshFbar(); persistEditor(); }
        else persistCard();
        return;
      }
    }
  }
  if(e.key === 'Escape'){
    if(ctxEl){ closeCtx(); return; }
    if(sheetOpen){ closeSheet(); return; }
    if(document.body.classList.contains('zen')){ setZen(false); return; }
    const a = document.activeElement;
    if(a && (a.isContentEditable || a.tagName === 'INPUT')){ a.blur(); return; }
    if(navStack.length > 1) pop();
  }
});
bindScrollBar(edScroll, $('#scr-editor .bar'));
// editor: condensed title once past the scene title
edScroll.addEventListener('scroll', () => {
  $('#scr-editor .bar').classList.toggle('scrolled', edScroll.scrollTop > 46);
}, { passive: true });

/* ================= boot ================= */
async function boot(){
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  await idbOpen();
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(() => {});
  }
  const saved = await kvGet('state');
  /* warm the Omnilingua engine early so the first translate is instant */
  Promise.resolve().then(async () => {
    try{
      if(saved && saved.codex && saved.codex.kind === 'omni-host'){
        const h = await kvGet('codexEngine');
        if(h){ window.__codexEngineHTML = h; }
      }
    }catch(e){}
  });
  if(saved && Array.isArray(saved.books)){
    state = saved;
    // gentle migration guard
    state.books.forEach(b => {
      b.exportOpts = b.exportOpts || defaultExportOpts();
      b.paraStyle = b.paraStyle || 'spaced';
      b.chapters = b.chapters || [];
      b.chapters.forEach(c => c.scenes = c.scenes || []);
      b.cards = (b.cards || []).map(c => ({
        id: c.id || uid(), type: c.type || 'person', title: c.title || '',
        aliases: c.aliases || [], keywords: c.keywords || [],
        quotes: c.quotes || [], notes: c.notes || '',
        created: c.created || Date.now(), updated: c.updated || Date.now()
      }));
    });
  }
  state.codex = state.codex || null;
  if(state.codex && state.codex.kind !== 'omni-host' && validateCodex(state.codex)) state.codex = null; // reject malformed packs from old saves
  if(omniPack()) ensureOmni(); // wake the codex engine in the background
  state.lastLang = state.lastLang || null;
  registerCodexFonts();
  if((state.tsv || 0) < 2){ state.tsv = 2; rerenderAllSpans(); }
  if(!idbOK){
    const banner = $('#banner');
    banner.innerHTML = 'Storage isn’t available here, so this session lives in memory only. On your phone, work saves automatically — and you can always export or back up.';
    banner.classList.add('show');
  }
  renderLibrary();
}
boot();

})();
</script>
